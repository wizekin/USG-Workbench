[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "usg-workbench-local"
version = "0.1.0"
description = "Local USG-SEM/1.0 semantic workbench with SQLite canonical persistence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]
license = { text = "Proprietary project source; see repository license terms" }

[project.scripts]
usg-workbench = "tools.usg_local_api_v1_0_0.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tools = ["usg-kernel-lab/*.py", "usg-kernel-lab/*.html", "usg-kernel-lab/*.bat", "usg-kernel-lab/README.md"]
specifications = ["*.json"]
rules = ["**/*.json"]
benchmarks = ["**/*.json"]
examples = ["phase3/*.json", "phase3/*.md"]
release = ["*.json"]
