name: Step 5K Native Assertion Model

on:
  pull_request:
    paths:
      - "implementations/python-kernel/v0.8.0/**"
      - "interoperability/python-kernel-extension/STEP-5K-NATIVE-ASSERTION-MODEL.md"
      - ".github/workflows/step-5k-native-assertion-model.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v0.8.0/**"
      - "interoperability/python-kernel-extension/STEP-5K-NATIVE-ASSERTION-MODEL.md"
      - ".github/workflows/step-5k-native-assertion-model.yml"

permissions:
  contents: read

jobs:
  native-assertion-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native Assertion model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v0.8.0
        run: python -m unittest discover -s implementations/python-kernel/v0.8.0/tests -v
