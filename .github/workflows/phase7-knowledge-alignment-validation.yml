name: Phase 7 Bilingual Alignment Proposal Validation

on:
  pull_request:
    paths:
      - 'tools/phase7_knowledge_alignment/**'
      - 'tools/phase7_knowledge_contract/**'
      - 'specifications/usg-knowledge-0.1.0.schema.json'
      - 'resources/lexical/v0.3.0/en-ar-discourse-lexicon.json'
      - 'tests/test_phase7_knowledge_alignment.py'
      - '.github/workflows/phase7-knowledge-alignment-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Compile alignment proposal builder
        run: python -m compileall -q tools/phase7_knowledge_alignment
      - name: Test bilingual alignment proposal builder
        run: python -m unittest discover -s tests -p 'test_phase7_knowledge_alignment.py' -v
      - name: Protect canonical and prior phase contracts
        run: |
          git diff --exit-code origin/main...HEAD -- specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json
          git diff --exit-code origin/main...HEAD -- documentation/PHASE-[1-6]* tools/semantic_graph_store_v1_0_0 tools/usg_interpretation_v0_1_0 tools/usg_interpretation_v0_2_0 archives/ implementations/semantic-workbench-js/
