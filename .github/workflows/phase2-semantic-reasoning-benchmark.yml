name: Phase 2 Semantic Reasoning Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/semantic-reasoning/v1.0.0/**"
      - "tools/semantic_reasoning_benchmark_v1_0_0/**"
      - "tests/test_semantic_reasoning_benchmark.py"
      - "documentation/PHASE-2-STEP-2.2-BENCHMARK-CORPUS-AND-EVALUATOR.md"
      - ".github/workflows/phase2-semantic-reasoning-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/semantic-reasoning/v1.0.0/**"
      - "tools/semantic_reasoning_benchmark_v1_0_0/**"
      - "tests/test_semantic_reasoning_benchmark.py"
      - "documentation/PHASE-2-STEP-2.2-BENCHMARK-CORPUS-AND-EVALUATOR.md"
      - ".github/workflows/phase2-semantic-reasoning-benchmark.yml"

permissions:
  contents: read

jobs:
  semantic-reasoning-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Validate benchmark corpus and evaluator contracts
        run: |
          python -m py_compile tools/semantic_reasoning_benchmark_v1_0_0/evaluator.py
          python -m unittest discover -s tests -p "test_semantic_reasoning_benchmark.py" -v
