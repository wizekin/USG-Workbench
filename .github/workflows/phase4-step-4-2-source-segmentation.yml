name: Phase 4 Step 4.2 Source Ingestion and Segmentation

on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tests/test_phase4_source_segmentation.py"
      - ".github/workflows/phase4-step-4-2-source-segmentation.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tests/test_phase4_source_segmentation.py"
      - ".github/workflows/phase4-step-4-2-source-segmentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-segmentation:
    name: phase4-source-segmentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared schema validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile source package
        run: python -m compileall -q tools/usg_interpretation_v0_1_0
      - name: Run Step 4.2 tests
        run: python -m unittest discover -s tests -p "test_phase4_source_segmentation.py" -v
      # The repository's existing Phase 3 integrated exit workflow is
      # triggered by this tests/test_phase*.py change and runs the complete
      # Phase 1–3 regression gate with its pinned dependency set.
