name: USG Evidence-Driven Growth Controller

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:
    inputs:
      max_campaigns:
        description: "Maximum recent Open-World campaigns to analyze"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: usg-evidence-driven-growth-controller
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install report validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Test growth controller and blocker attribution
        run: |
          python -m unittest discover -s tests -p "test_open_world_growth_controller.py" -v
          python -m unittest discover -s tests -p "test_open_world_growth_diagnostics.py" -v
      - name: Build evidence-driven growth plan
        env:
          MAX_CAMPAIGNS: ${{ github.event.inputs.max_campaigns || '10' }}
        run: |
          python -m tools.open_world_evaluation.growth_controller \
            --max-campaigns "$MAX_CAMPAIGNS" \
            --output "$RUNNER_TEMP/usg-growth-plan.json" \
            --markdown "$RUNNER_TEMP/usg-growth-plan.md"
          cat "$RUNNER_TEMP/usg-growth-plan.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload growth plan and evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: usg-growth-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/usg-growth-plan.json
            ${{ runner.temp }}/usg-growth-plan.md
          if-no-files-found: error
          retention-days: 90
