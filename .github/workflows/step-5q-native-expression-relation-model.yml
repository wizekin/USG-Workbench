name: Step 5Q Native ExpressionRelation Model
on:
  pull_request:
    paths:
      - "implementations/python-kernel/v1.1.0/**"
      - "interoperability/python-kernel-extension/STEP-5Q-NATIVE-EXPRESSION-RELATION-MODEL.md"
      - ".github/workflows/step-5q-native-expression-relation-model.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v1.1.0/**"
      - "interoperability/python-kernel-extension/STEP-5Q-NATIVE-EXPRESSION-RELATION-MODEL.md"
      - ".github/workflows/step-5q-native-expression-relation-model.yml"
permissions:
  contents: read
jobs:
  native-expression-relation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native ExpressionRelation model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.1.0
        run: python -m unittest discover -s implementations/python-kernel/v1.1.0/tests -v
