name: Phase 6 Broader Semantics Candidate Contract
on:
  pull_request:
    paths:
      - "tools/phase6_broader_semantics_v0_1/**"
      - "tests/test_phase6_broader_semantics.py"
      - "documentation/PHASE-6-STEPS-6.7-6.12-CANDIDATE-COMPOSITION.md"
      - ".github/workflows/phase6-broader-semantics-candidate.yml"
  push:
    branches: [main]
    paths:
      - "tools/phase6_broader_semantics_v0_1/**"
      - "tests/test_phase6_broader_semantics.py"
      - ".github/workflows/phase6-broader-semantics-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile candidate composition engine
        run: python -m compileall -q tools/phase6_broader_semantics_v0_1
      - name: Run contract and adversarial tests
        run: python -m unittest discover -s tests -p 'test_phase6_broader_semantics.py' -v
      - name: Verify protected contracts and implementation lines are untouched
        run: |
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- documentation/PHASE-[1-5]* specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json tools/usg_interpretation_v0_1_0 tools/usg_interpretation_v0_2_0 archives/ implementations/
