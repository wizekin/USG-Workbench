name: Phase 2 Deterministic Grounding Services

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/semantic_grounding_v1_0_0/**"
      - "tests/test_phase2_grounding.py"
      - "documentation/PHASE-2-STEP-2.5-DETERMINISTIC-GROUNDING-SERVICES.md"
      - ".github/workflows/phase2-grounding.yml"
  push:
    branches: [main]
    paths:
      - "tools/semantic_grounding_v1_0_0/**"
      - "tests/test_phase2_grounding.py"
      - "documentation/PHASE-2-STEP-2.5-DETERMINISTIC-GROUNDING-SERVICES.md"
      - ".github/workflows/phase2-grounding.yml"

permissions:
  contents: read

jobs:
  deterministic-grounding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Validate grounding services
        run: |
          python -m py_compile tools/semantic_grounding_v1_0_0/grounding.py
          python -m unittest discover -s tests -p "test_phase2_grounding.py" -v
