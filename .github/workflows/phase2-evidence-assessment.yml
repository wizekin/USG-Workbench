name: Phase 2 Evidence Assessment

on:
  pull_request:
    paths:
      - "tools/semantic_evidence_assessment_v1_0_0/**"
      - "rules/semantic-reasoning/evidence/v1.0.0/**"
      - "benchmarks/semantic-reasoning/evidence-v1.0.0/**"
      - "tests/test_phase2_evidence_assessment.py"
      - "documentation/PHASE-2-STEP-2.7-EVIDENCE-SUPPORT-AND-CONFLICT-ASSESSMENT.md"
      - ".github/workflows/phase2-evidence-assessment.yml"
      - "specifications/usg-sem-1.0.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-assessment-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile assessment package
        run: python -m compileall -q tools/semantic_evidence_assessment_v1_0_0
      - name: Validate Phase 2 declarative contracts
        run: |
          python -m tools.semantic_rule_registry_v1_0_0.validator
          python -m tools.semantic_rule_semantics_v1_0_0.validator
      - name: Run Phase 2 regression suites
        run: python -m unittest discover -s tests -p 'test_phase2_*.py' -v
