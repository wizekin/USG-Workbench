name: Step 5O Native Context Model
on:
  pull_request:
    paths:
      - "implementations/python-kernel/v1.0.0/**"
      - "interoperability/python-kernel-extension/STEP-5O-NATIVE-CONTEXT-MODEL.md"
      - ".github/workflows/step-5o-native-context-model.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v1.0.0/**"
      - "interoperability/python-kernel-extension/STEP-5O-NATIVE-CONTEXT-MODEL.md"
      - ".github/workflows/step-5o-native-context-model.yml"
permissions:
  contents: read
jobs:
  native-context-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native Context model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.0.0
        run: python -m unittest discover -s implementations/python-kernel/v1.0.0/tests -v
