name: Phase 6 Step 6.4 PUD Morphology Generalization
on:
  pull_request:
    paths:
      - "tools/phase6_external_pud_v0_4/**"
      - "tests/test_phase6_external_pud_morphology.py"
      - "documentation/PHASE-6-STEP-6.4-PUD-MORPHOLOGY.md"
      - ".github/workflows/phase6-step-6-4-pud-morphology.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pud-morphology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_phase6_external_pud_morphology.py' -v
      - run: python -m tools.phase6_external_pud_v0_4.morphology
      - name: Upload held-out morphology report
        uses: actions/upload-artifact@v4
        with:
          name: phase6-step-6-4-pud-morphology
          path: artifacts/phase6-step-6-4-pud-morphology.json
