name: Phase 3 Storage Candidate Evaluation — Qdrant (scope-qualified snapshot benchmark)
on:
  pull_request:
    paths:
      - "tools/semantic_graph_store_qdrant_v1_0_0/**"
      - "tests/test_phase3_qdrant_store.py"
      - "benchmarks/phase3-storage/compare_sqlite_qdrant.py"
      - ".github/workflows/phase3-qdrant-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "tools/semantic_graph_store_qdrant_v1_0_0/**"
      - "tests/test_phase3_qdrant_store.py"
      - "benchmarks/phase3-storage/compare_sqlite_qdrant.py"
      - ".github/workflows/phase3-qdrant-evaluation.yml"
permissions:
  contents: read
jobs:
  qdrant-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install "jsonschema>=4.18,<5" "qdrant-client>=1.14,<2"
      - name: Compile adapter
        run: python -m compileall -q tools/semantic_graph_store_qdrant_v1_0_0
      - name: Run SQLite baseline tests
        run: python -m unittest discover -s tests -p "test_phase3_graph_store.py" -v
      - name: Run Phase 1 and Phase 2 regressions
        run: |
          python -m unittest discover -s tests -p "test_phase1_exit_acceptance.py" -v
          python -m unittest discover -s tests -p "test_phase2_grounding.py" -v
          python -m unittest discover -s tests -p "test_phase2_inference_executor.py" -v
          python -m unittest discover -s tests -p "test_phase2_evidence_assessment.py" -v
      - name: Run Qdrant adapter tests
        run: python -m unittest discover -s tests -p "test_phase3_qdrant_store.py" -v
      - name: Run SQLite/Qdrant workload benchmark
        run: python benchmarks/phase3-storage/compare_sqlite_qdrant.py --repeats 3 --extra-expressions 1200
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: phase3-qdrant-benchmark
          path: phase3-qdrant-benchmark.json
