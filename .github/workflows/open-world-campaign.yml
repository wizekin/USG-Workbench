name: Open-World Campaign Reporting Pipeline

on:
  pull_request:
    paths:
      - "README.md"
      - "documentation/USG-OPEN-WORLD-CAMPAIGN-REPORTING.md"
      - "tools/open_world_evaluation/**"
      - "tests/test_open_world_campaign.py"
      - "tests/test_open_world_growth_diagnostics.py"
      - "tests/test_open_world_growth_diagnostics.py"
      - ".github/workflows/open-world-campaign.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "documentation/USG-OPEN-WORLD-CAMPAIGN-REPORTING.md"
      - "tools/open_world_evaluation/**"
      - "tests/test_open_world_campaign.py"
      - "tests/test_open_world_growth_diagnostics.py"
      - ".github/workflows/open-world-campaign.yml"

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protocol and report dependencies
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run OW-5 report, storage, and minimizer tests
        run: python -m unittest discover -s tests -p "test_open_world_campaign.py" -v
      - name: Test system-wide execution accounting and stage attribution
        run: python -m unittest discover -s tests -p "test_open_world_growth_diagnostics.py" -v
      - name: Run a fully local generator-to-report smoke pipeline
        run: |
          set -euo pipefail
          python -m tools.open_world_evaluation.generate_scenarios \
            --count 2 \
            --seed "ow5-campaign-report-smoke" \
            --created-at "2026-11-11T14:00:00Z" \
            --target phase4-bounded-interpreter \
            --output "$RUNNER_TEMP/ow5-cases.jsonl"
          python -m tools.open_world_evaluation.execute_cases \
            --input "$RUNNER_TEMP/ow5-cases.jsonl" \
            --output "$RUNNER_TEMP/ow5-results.jsonl" \
            --commit-sha "$GITHUB_SHA" \
            --max-wall-seconds 30
          python -m tools.open_world_evaluation.score_cases \
            --cases "$RUNNER_TEMP/ow5-cases.jsonl" \
            --results "$RUNNER_TEMP/ow5-results.jsonl" \
            --scores "$RUNNER_TEMP/ow5-scores.jsonl" \
            --summary "$RUNNER_TEMP/ow5-score-summary.json"
          python -m tools.open_world_evaluation.campaign_pipeline \
            --campaign-id OWC-OW5-CI-SMOKE-0001 \
            --cases "$RUNNER_TEMP/ow5-cases.jsonl" \
            --results "$RUNNER_TEMP/ow5-results.jsonl" \
            --scores "$RUNNER_TEMP/ow5-scores.jsonl" \
            --generation-manifest "$RUNNER_TEMP/ow5-cases.jsonl.manifest.json" \
            --commit-sha "$GITHUB_SHA" \
            --output-root "$RUNNER_TEMP/ow5-campaigns"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ow5-campaigns" / "OWC-OW5-CI-SMOKE-0001"
          report = json.loads((root / "campaign-report.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "bundle-manifest.json").read_text(encoding="utf-8"))
          assert report["attempted"] == 2
          assert report["coverage"]["case_count"] == 2
          assert len(report["population_results"]) == 3
          assert manifest["append_only"] is True
          PY
      - name: Compile report and minimizer modules
        run: |
          python -m py_compile tools/open_world_evaluation/campaign_pipeline.py
          python -m py_compile tools/open_world_evaluation/minimize_failures.py
