name: Step 5U Native Derivation Model
on:
  pull_request:
    paths:
      - "implementations/python-kernel/v1.3.0/**"
      - "interoperability/python-kernel-extension/STEP-5U-NATIVE-DERIVATION-MODEL.md"
      - ".github/workflows/step-5u-native-derivation-model.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v1.3.0/**"
      - "interoperability/python-kernel-extension/STEP-5U-NATIVE-DERIVATION-MODEL.md"
      - ".github/workflows/step-5u-native-derivation-model.yml"
permissions:
  contents: read
jobs:
  native-derivation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native Derivation model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.3.0
        run: python -m unittest discover -s implementations/python-kernel/v1.3.0/tests -v
