name: Legacy Step 6.6 Human-Gold Manifest Validator (retired)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-manifest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema==4.23.0"
      - run: python -m compileall -q tools/phase6_independent_gold_v1_0
      - run: python -m unittest discover -s tests -p 'test_phase6_independent_gold_gate.py' -v
