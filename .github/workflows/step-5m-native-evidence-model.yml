name: Step 5M Native Evidence Model

on:
  pull_request:
    paths:
      - "implementations/python-kernel/v0.9.0/**"
      - "interoperability/python-kernel-extension/STEP-5M-NATIVE-EVIDENCE-MODEL.md"
      - ".github/workflows/step-5m-native-evidence-model.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v0.9.0/**"
      - "interoperability/python-kernel-extension/STEP-5M-NATIVE-EVIDENCE-MODEL.md"
      - ".github/workflows/step-5m-native-evidence-model.yml"

permissions:
  contents: read

jobs:
  native-evidence-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native Evidence model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v0.9.0
        run: python -m unittest discover -s implementations/python-kernel/v0.9.0/tests -v
