name: Phase 5 Step 5.9 Persistent Resource Catalogue
on:
  pull_request:
    paths:
      - "tools/usg_resource_catalogue_v0_1_0/**"
      - "tests/test_phase5_*.py"
      - "documentation/PHASE-5-STEP-5.9-RESOURCE-CATALOGUE.md"
      - "documentation/PHASE-5-DEFINITIONS-ROADMAP.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-9-resource-catalogue.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_resource_catalogue_v0_1_0/**"
      - "tests/test_phase5_*.py"
      - "documentation/PHASE-5-STEP-5.9-RESOURCE-CATALOGUE.md"
      - "documentation/PHASE-5-DEFINITIONS-ROADMAP.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-9-resource-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-catalogue:
    name: resource-catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile the resource catalogue
        run: python -m compileall -q tools/usg_resource_catalogue_v0_1_0
      - name: Run persistent resource catalogue tests
        run: python -m unittest discover -s tests -p "test_phase5_resource_catalogue.py" -v
      - name: Run all Phase 5 regressions
        run: python -m unittest discover -s tests -p "test_phase5_*.py" -v
      - name: Run frozen Phase 4 regression suite
        run: python -m unittest discover -s tests -p "test_phase4_*.py" -v
      - name: Verify immutable contracts and historical baselines
        run: |
          git fetch origin main --depth=1
          git diff --exit-code FETCH_HEAD...HEAD -- \
            specifications/USG-SEM-1.0.md \
            specifications/usg-sem-1.0.schema.json \
            tools/usg_interpretation_v0_1_0 \
            tools/semantic_graph_store_v1_0_0 \
            benchmarks/phase4-interpretation/ \
            benchmarks/phase5-interpretation/ \
            archives/ implementations/
