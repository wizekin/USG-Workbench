name: Open-World Diagnostic Oracle Portfolio

on:
  pull_request:
    paths:
      - "tools/open_world_evaluation/import_diagnostics.py"
      - "tools/open_world_evaluation/score_cases.py"
      - "tools/open_world_evaluation/generate_scenarios.py"
      - "tools/open_world_evaluation/schemas/scenario.schema.json"
      - "tests/test_open_world_diagnostics.py"
      - "tests/test_open_world_generator.py"
      - ".github/workflows/open-world-diagnostics.yml"
  push:
    branches: [main]
    paths:
      - "tools/open_world_evaluation/import_diagnostics.py"
      - "tools/open_world_evaluation/score_cases.py"
      - "tools/open_world_evaluation/generate_scenarios.py"
      - "tools/open_world_evaluation/schemas/scenario.schema.json"
      - "tests/test_open_world_diagnostics.py"
      - "tests/test_open_world_generator.py"
      - ".github/workflows/open-world-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Verify imported gold fixtures and exact oracle scoring
        run: python -m unittest discover -s tests -p "test_open_world_diagnostics.py" -v
      - name: Verify Arabic-only request generation
        run: python -m unittest discover -s tests -p "test_open_world_generator.py" -v
      - name: Compile diagnostic importer and scorer
        run: |
          python -m py_compile tools/open_world_evaluation/import_diagnostics.py
          python -m py_compile tools/open_world_evaluation/score_cases.py
