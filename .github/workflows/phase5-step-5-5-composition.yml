name: Phase 5 Step 5.5 Nested Semantic Composition
on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_2_0/**"
      - "specifications/usg-interpret-expression-graph-0.2.0.schema.json"
      - "tests/test_phase5_semantic_composition.py"
      - "documentation/PHASE-5-STEP-5.5-NESTED-SEMANTIC-COMPOSITION.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-5-composition.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_2_0/**"
      - "specifications/usg-interpret-expression-graph-0.2.0.schema.json"
      - "tests/test_phase5_semantic_composition.py"
      - "documentation/PHASE-5-STEP-5.5-NESTED-SEMANTIC-COMPOSITION.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-5-composition.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile v0.2 package
        run: python -m compileall -q tools/usg_interpretation_v0_2_0
      - name: Validate expression graph schema and run composition tests
        run: python -m unittest discover -s tests -p "test_phase5_semantic_composition.py" -v
      - name: Run Phase 5 syntax, lexical, and benchmark regressions
        run: |
          python -m unittest discover -s tests -p "test_phase5_segmentation_syntax.py" -v
          python -m unittest discover -s tests -p "test_phase5_lexical_resources.py" -v
          python -m unittest discover -s tests -p "test_phase5_benchmark.py" -v
      - name: Run frozen Phase 4 regression suite
        run: python -m unittest discover -s tests -p "test_phase4_*.py" -v
      - name: Verify canonical semantic schema and historical baselines remain unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json tools/usg_interpretation_v0_1_0 benchmarks/phase4-interpretation/ benchmarks/phase5-interpretation/ archives/ implementations/
