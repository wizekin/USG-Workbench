name: Phase 5 Step 5.6 Scoped Operators
on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_2_0/**"
      - "resources/lexical/v0.2.0/**"
      - "resources/operators/v0.1.0/**"
      - "specifications/usg-interpret-expression-graph-0.2.0.schema.json"
      - "tests/test_phase5_operator_scope.py"
      - "documentation/PHASE-5-STEP-5.6-SCOPED-OPERATORS.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-6-operators.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_2_0/**"
      - "resources/lexical/v0.2.0/**"
      - "resources/operators/v0.1.0/**"
      - "specifications/usg-interpret-expression-graph-0.2.0.schema.json"
      - "tests/test_phase5_operator_scope.py"
      - "documentation/PHASE-5-STEP-5.6-SCOPED-OPERATORS.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-6-operators.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operators:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Validate lexical and operator resources
        run: |
          python -c "import json; from jsonschema import Draft202012Validator; s=json.load(open('resources/lexical/v0.2.0/lexicon.schema.json', encoding='utf-8')); d=json.load(open('resources/lexical/v0.2.0/en-ar-operator-lexicon.json', encoding='utf-8')); Draft202012Validator(s).validate(d)"
          python -c "import json; from jsonschema import Draft202012Validator; s=json.load(open('resources/operators/v0.1.0/operators.schema.json', encoding='utf-8')); d=json.load(open('resources/operators/v0.1.0/operators-en-ar.json', encoding='utf-8')); Draft202012Validator(s).validate(d)"
      - name: Compile v0.2 package and validate expression graph schema
        run: python -m compileall -q tools/usg_interpretation_v0_2_0
      - name: Run scoped operator tests
        run: python -m unittest discover -s tests -p "test_phase5_operator_scope.py" -v
      - name: Run semantic composition, syntax, lexical, and benchmark regressions
        run: |
          python -m unittest discover -s tests -p "test_phase5_semantic_composition.py" -v
          python -m unittest discover -s tests -p "test_phase5_segmentation_syntax.py" -v
          python -m unittest discover -s tests -p "test_phase5_lexical_resources.py" -v
          python -m unittest discover -s tests -p "test_phase5_benchmark.py" -v
      - name: Run frozen Phase 4 regression suite
        run: python -m unittest discover -s tests -p "test_phase4_*.py" -v
      - name: Verify canonical semantic schema and historical baselines
        run: |
          git diff --exit-code origin/main...HEAD -- specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json tools/usg_interpretation_v0_1_0 benchmarks/phase4-interpretation/ benchmarks/phase5-interpretation/ archives/ implementations/
