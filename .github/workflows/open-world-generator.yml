name: Open-World Random Scenario Generator

on:
  pull_request:
    paths:
      - "README.md"
      - "documentation/USG-OPEN-WORLD-RANDOM-SCENARIO-GENERATOR.md"
      - "tools/open_world_evaluation/**"
      - "tests/test_open_world_generator.py"
      - ".github/workflows/open-world-generator.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "documentation/USG-OPEN-WORLD-RANDOM-SCENARIO-GENERATOR.md"
      - "tools/open_world_evaluation/**"
      - "tests/test_open_world_generator.py"
      - ".github/workflows/open-world-generator.yml"

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protocol schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run deterministic generator tests
        run: python -m unittest discover -s tests -p "test_open_world_generator.py" -v
      - name: Generate reproducible target-matrix smoke campaign
        run: |
          python -m tools.open_world_evaluation.generate_scenarios \
            --count 12 \
            --seed "ow2-github-actions-smoke-seed" \
            --created-at "2026-11-11T11:00:00Z" \
            --target-matrix \
            --output "$RUNNER_TEMP/ow2-smoke.jsonl"
          python -c "from pathlib import Path; p=Path('$RUNNER_TEMP/ow2-smoke.jsonl'); assert len(p.read_text(encoding='utf-8').splitlines()) == 36"
      - name: Compile generator and validator
        run: |
          python -m py_compile tools/open_world_evaluation/generate_scenarios.py
          python -m py_compile tools/open_world_evaluation/validate_protocol.py
