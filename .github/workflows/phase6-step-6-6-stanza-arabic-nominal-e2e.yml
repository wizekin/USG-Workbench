name: Phase 6 Step 6.6 Stanza Arabic Nominal End-to-End
on:
  pull_request:
    paths:
      - "tools/phase6_stanza_nominal_e2e_v0_1/**"
      - "tools/phase6_ud_nominal_candidate_v0_1/**"
      - "tests/test_phase6_stanza_arabic_nominal_e2e.py"
      - "documentation/PHASE-6-STEP-6.6-STANZA-ARABIC-NOMINAL-E2E.md"
      - ".github/workflows/phase6-step-6-6-stanza-arabic-nominal-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stanza-arabic-nominal-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.9.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install stanza==1.15.0
      - run: python -m unittest discover -s tests -p 'test_phase6_stanza_arabic_nominal_e2e.py' -v
      - run: python -m tools.phase6_stanza_nominal_e2e_v0_1.evaluation
      - name: Upload Arabic parser and nominal candidate report
        uses: actions/upload-artifact@v4
        with:
          name: phase6-step-6-6-stanza-arabic-nominal-e2e
          path: artifacts/phase6-step-6-6-stanza-arabic-nominal-e2e.json
