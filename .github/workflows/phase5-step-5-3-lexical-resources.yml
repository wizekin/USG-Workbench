name: Phase 5 Step 5.3 Lexical and Morphology Resources
on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_2_0/**"
      - "resources/lexical/v0.1.0/**"
      - "tests/test_phase5_lexical_resources.py"
      - "documentation/PHASE-5-STEP-5.3-LEXICAL-MORPHOLOGY-RESOURCES.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-3-lexical-resources.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_2_0/**"
      - "resources/lexical/v0.1.0/**"
      - "tests/test_phase5_lexical_resources.py"
      - "documentation/PHASE-5-STEP-5.3-LEXICAL-MORPHOLOGY-RESOURCES.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-3-lexical-resources.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lexical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Validate lexical resource schema and compile package
        run: |
          python -c "import json; from jsonschema import Draft202012Validator; s=json.load(open('resources/lexical/v0.1.0/lexicon.schema.json', encoding='utf-8')); d=json.load(open('resources/lexical/v0.1.0/en-ar-foundation-lexicon.json', encoding='utf-8')); Draft202012Validator(s).validate(d)"
          python -m compileall -q tools/usg_interpretation_v0_2_0
      - name: Run Phase 5 lexical resource tests
        run: python -m unittest discover -s tests -p "test_phase5_lexical_resources.py" -v
      - name: Run frozen Phase 4 regression suite
        run: python -m unittest discover -s tests -p "test_phase4_*.py" -v
      - name: Verify immutable semantic and historical baselines
        run: |
          git diff --exit-code origin/main...HEAD -- specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json tools/usg_interpretation_v0_1_0 benchmarks/phase4-interpretation/ benchmarks/phase5-interpretation/ archives/ implementations/
