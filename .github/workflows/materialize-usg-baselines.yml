name: Materialize USG baseline archives

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-usg-baselines
  cancel-in-progress: false

jobs:
  extract-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify and extract immutable source archives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, shutil, zipfile
          
          jobs = [
              {
                  "archive": Path("archives/workbench/USG_Semantic_Workbench_v0.5.4.zip"),
                  "target": Path("implementations/semantic-workbench-js/v0.5.4"),
                  "sha256": "9c76280ad000abaf14b52545bf6de9d25656744428f1257519c2c09ebff434a9",
                  "strip": "USG_Semantic_Workbench_v0.5.4/",
                  "expected_files": 56,
              },
              {
                  "archive": Path("archives/python-kernel/usg-semantic-kernel-corrected.zip"),
                  "target": Path("implementations/python-kernel/v0.4.0"),
                  "sha256": "de3c4466b61ac1d09f23761b7c31faa0f685fdf3bfb148e7e60f132552e1095e",
                  "strip": "",
                  "expected_files": 152,
              },
          ]
          
          for job in jobs:
              archive = job["archive"]
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual != job["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {archive}: {actual}")
              target = job["target"]
              if target.exists():
                  shutil.rmtree(target)
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise SystemExit(f"Corrupt ZIP member in {archive}: {bad}")
                  for info in zf.infolist():
                      if info.is_dir():
                          continue
                      name = info.filename
                      if job["strip"]:
                          if not name.startswith(job["strip"]):
                              raise SystemExit(f"Unexpected Workbench archive root: {name}")
                          name = name[len(job["strip"]):]
                          if not name:
                              continue
                      p = PurePosixPath(name)
                      if p.is_absolute() or ".." in p.parts or not p.parts:
                          raise SystemExit(f"Unsafe archive path: {info.filename}")
                      mode = (info.external_attr >> 16) & 0o170000
                      if mode == 0o120000:
                          raise SystemExit(f"Symlink entry not allowed: {info.filename}")
                      out = target.joinpath(*p.parts)
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_bytes(zf.read(info))
              files = [p for p in target.rglob("*") if p.is_file()]
              if len(files) != job["expected_files"]:
                  raise SystemExit("Unexpected extracted file count: " + str(len(files)) + " != " + str(job["expected_files"]))
              print(f"{archive}: extracted and verified {len(files)} files to {target}")
          PY

      - name: Run Workbench test suite
        working-directory: implementations/semantic-workbench-js/v0.5.4
        run: bash tests/run_all_tests.sh

      - name: Run Python kernel test suite
        working-directory: implementations/python-kernel/v0.4.0
        run: python -m unittest discover -s tests -t .

      - name: Add implementation boundary documentation
        shell: bash
        run: |
          mkdir -p implementations/semantic-workbench-js implementations/python-kernel
          cat > implementations/README.md <<'EOF'
          # Versioned implementation baselines

          This directory contains source extracted from the immutable release archives in archives/.

          - semantic-workbench-js/v0.5.4/: JavaScript/browser Semantic Workbench v0.5.4.
          - python-kernel/v0.4.0/: Python reference system/kernel v0.4.0.

          These are separate implementations with independent versioning, runtimes, tests, and internal representations. Their co-location does not imply integration or semantic interoperability. The original ZIP archives remain preserved under archives/.
          EOF
          cat > implementations/semantic-workbench-js/README.md <<'EOF'
          # USG Semantic Workbench — JavaScript line

          Versioned source releases are stored in subdirectories. Current archived baseline: v0.5.4/.
          See ARCHIVE_INVENTORY.md at the repository root for checksums, test results, and known discrepancies.
          EOF
          cat > implementations/python-kernel/README.md <<'EOF'
          # USG Python reference kernel

          Versioned source releases are stored in subdirectories. Current archived baseline: v0.4.0/.
          See ARCHIVE_INVENTORY.md at the repository root for checksums, test results, and known discrepancies.
          EOF
          cat > README.md <<'EOF'
          # USG Workbench Repository

          This repository preserves the distinct implementation baselines and the specifications/documentation used to evolve the Universal Semantic Grammar (USG) project.

          ## Repository structure

          - archives/: original, checksum-verified release ZIPs; preserved unchanged.
          - implementations/semantic-workbench-js/: JavaScript/browser Semantic Workbench releases.
          - implementations/python-kernel/: Python reference kernel releases.
          - specifications/: normative semantic contracts and schemas.
          - documentation/: architecture decisions, design notes, and project documentation.
          - interoperability/: adapters and conformance work connecting implementations through explicit contracts.
          - tests/: cross-implementation fixtures and conformance tests.
          - ARCHIVE_INVENTORY.md: archive hashes, baseline inspection, test evidence, and limitations.

          ## Important architecture boundary

          The JavaScript Semantic Workbench and Python reference kernel are separate implementation lines. Their versions and internal representations are not interchangeable. A feature present in one must not be assumed to exist in the other. Interoperability must be explicit, versioned, and tested; unsupported mappings must be reported rather than silently coerced or discarded.

          ## Baseline status

          The archive inventory records fresh tests and limitations for the original packages. Passing package tests do not establish unrestricted natural-language understanding or general semantic correctness.
          EOF

      - name: Commit extracted baselines and documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Remove test-generated bytecode so the committed tree contains only archive contents.
          find implementations -type d -name __pycache__ -prune -exec rm -rf {} +
          find implementations -type f -name '*.pyc' -delete
          git add -f README.md implementations
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
          else
            git commit -m "chore: extract versioned USG implementation baselines"
            git push
          fi
