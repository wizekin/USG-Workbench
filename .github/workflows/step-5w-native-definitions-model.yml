name: Step 5W Native Definitions Model
on:
  pull_request:
    paths:
      - "implementations/python-kernel/v1.4.0/**"
      - "interoperability/python-kernel-extension/STEP-5W-NATIVE-DEFINITIONS-MODEL.md"
      - ".github/workflows/step-5w-native-definitions-model.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v1.4.0/**"
      - "interoperability/python-kernel-extension/STEP-5W-NATIVE-DEFINITIONS-MODEL.md"
      - ".github/workflows/step-5w-native-definitions-model.yml"
permissions:
  contents: read
jobs:
  native-definitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native Definitions model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.4.0
        run: python -m unittest discover -s implementations/python-kernel/v1.4.0/tests -v
