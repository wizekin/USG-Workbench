name: Phase 4 Step 4.13 Integrated Exit Acceptance
on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tools/phase4_interpretation_benchmark_v0_1_0/**"
      - "tools/phase4_exit_acceptance_v0_1_0/**"
      - "benchmarks/phase4-interpretation/**"
      - "tests/test_phase4_*.py"
      - "documentation/PHASE-4-*.md"
      - "README.md"
      - ".github/workflows/phase4-step-4-13-exit-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tools/phase4_interpretation_benchmark_v0_1_0/**"
      - "tools/phase4_exit_acceptance_v0_1_0/**"
      - "benchmarks/phase4-interpretation/**"
      - "tests/test_phase4_*.py"
      - "documentation/PHASE-4-*.md"
      - "README.md"
      - ".github/workflows/phase4-step-4-13-exit-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase4-exit:
    name: phase4-bounded-exit-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile all Phase 4 packages
        run: |
          python -m compileall -q tools/usg_interpretation_v0_1_0
          python -m compileall -q tools/phase4_interpretation_benchmark_v0_1_0
          python -m compileall -q tools/phase4_exit_acceptance_v0_1_0
      - name: Run every Phase 4 automated test
        run: python -m unittest discover -s tests -p "test_phase4_*.py" -v
      - name: Run frozen benchmark
        run: python -m tools.phase4_interpretation_benchmark_v0_1_0.run --output /tmp/phase4-benchmark-report.json
      - name: Run bounded Phase 4 exit acceptance
        run: python -m tools.phase4_exit_acceptance_v0_1_0.run --output /tmp/phase4-exit-acceptance.json
      - name: Verify normative schema and historical implementations are unchanged
        run: git diff --exit-code origin/main...HEAD -- specifications/usg-sem-1.0.schema.json archives/ implementations/python-kernel/
      - name: Upload Phase 4 acceptance reports
        uses: actions/upload-artifact@v4
        with:
          name: usg-phase4-bounded-exit-acceptance
          path: |
            /tmp/phase4-benchmark-report.json
            /tmp/phase4-exit-acceptance.json
