name: OW-0 Repository Inventory

on:
  pull_request:
    paths:
      - "documentation/USG-OPEN-WORLD-REPOSITORY-INVENTORY.md"
      - "documentation/USG-OPEN-WORLD-CAPABILITY-INVENTORY.json"
      - "tools/open_world_evaluation/**"
      - "tests/test_open_world_inventory.py"
      - ".github/workflows/open-world-inventory.yml"
  push:
    branches: [main]
    paths:
      - "documentation/USG-OPEN-WORLD-REPOSITORY-INVENTORY.md"
      - "documentation/USG-OPEN-WORLD-CAPABILITY-INVENTORY.json"
      - "tools/open_world_evaluation/**"
      - "tests/test_open_world_inventory.py"
      - ".github/workflows/open-world-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate inventoried repository paths and states
        run: python tools/open_world_evaluation/validate_inventory.py
      - name: Test OW-0 inventory contract
        run: python -m unittest discover -s tests -p "test_open_world_inventory.py" -v
      - name: Compile inventory validator
        run: python -m py_compile tools/open_world_evaluation/validate_inventory.py
