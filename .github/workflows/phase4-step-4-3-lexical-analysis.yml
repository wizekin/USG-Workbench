name: Phase 4 Step 4.3 Lexical and Morphological Analysis

on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tests/test_phase4_lexical_analysis.py"
      - ".github/workflows/phase4-step-4-3-lexical-analysis.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tests/test_phase4_lexical_analysis.py"
      - ".github/workflows/phase4-step-4-3-lexical-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexical-analysis:
    name: phase4-lexical-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile interpretation package
        run: python -m compileall -q tools/usg_interpretation_v0_1_0
      - name: Run Step 4.3 tests
        run: python -m unittest discover -s tests -p "test_phase4_lexical_analysis.py" -v
      # Phase 3 integrated exit acceptance is triggered by the test_phase*.py
      # path and provides the pinned Phase 1–3 regression gate.
