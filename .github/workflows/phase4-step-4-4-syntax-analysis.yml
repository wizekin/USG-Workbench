name: Phase 4 Step 4.4 Grammar and Syntactic Analysis
on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tests/test_phase4_syntax_analysis.py"
      - ".github/workflows/phase4-step-4-4-syntax-analysis.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tests/test_phase4_syntax_analysis.py"
      - ".github/workflows/phase4-step-4-4-syntax-analysis.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-analysis:
    name: phase4-syntax-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile interpretation package
        run: python -m compileall -q tools/usg_interpretation_v0_1_0
      - name: Run Step 4.4 tests
        run: python -m unittest discover -s tests -p "test_phase4_syntax_analysis.py" -v
