name: Phase 6 Benchmark Annotation Correction v0.3.1
on:
  pull_request:
    paths:
      - "benchmarks/phase6-interpretation-v0.3.1/**"
      - "tools/phase6_interpretation_benchmark_v0_3_1/**"
      - "tests/test_phase6_benchmark_annotation_correction.py"
      - "documentation/PHASE-6-BENCHMARK-ANNOTATION-CORRECTION-0.3.1.md"
      - ".github/workflows/phase6-benchmark-annotation-correction.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/phase6-interpretation-v0.3.1/**"
      - "tools/phase6_interpretation_benchmark_v0_3_1/**"
      - "tests/test_phase6_benchmark_annotation_correction.py"
      - ".github/workflows/phase6-benchmark-annotation-correction.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corrected-gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema==4.23.0"
      - run: |
          python -m compileall -q tools/phase6_interpretation_benchmark_v0_3_1
          python -m tools.phase6_interpretation_benchmark_v0_3_1.run
          python -m unittest discover -s tests -p 'test_phase6_benchmark_annotation_correction.py' -v
