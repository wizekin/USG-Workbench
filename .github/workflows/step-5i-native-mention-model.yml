name: Step 5I Native Mention Model

on:
  pull_request:
    paths:
      - "implementations/python-kernel/v0.7.0/**"
      - "interoperability/python-kernel-extension/STEP-5I-NATIVE-MENTION-MODEL.md"
      - ".github/workflows/step-5i-native-mention-model.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v0.7.0/**"
      - "interoperability/python-kernel-extension/STEP-5I-NATIVE-MENTION-MODEL.md"
      - ".github/workflows/step-5i-native-mention-model.yml"

permissions:
  contents: read

jobs:
  native-mention-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native Mention model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v0.7.0
        run: python -m unittest discover -s implementations/python-kernel/v0.7.0/tests -v
