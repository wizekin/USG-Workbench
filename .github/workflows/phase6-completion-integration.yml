name: Phase 6 Candidate Integration and Composition Exit Gate
on:
  pull_request:
    paths:
      - "tools/phase6_broader_semantics_v0_1/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "tests/test_phase6_broader_semantics*.py"
      - "tests/test_phase6_step_6_5_predicate_argument.py"
      - "tests/test_phase6_integrated_interpreter.py"
      - "tests/test_phase6_candidate_provider_integration.py"
      - "tests/test_phase6_nominal_candidate_v0_4_1.py"
      - "tests/test_phase6_candidate_provider_integration.py"
      - "tests/test_phase6_nominal_candidate_v0_4_1.py"
      - "documentation/PHASE-6-STEPS-6.7-6.14-COMPLETION-IMPLEMENTATION.md"
      - "documentation/PHASE-6-INTEGRATED-INTERPRETER-AND-BRIDGE-VALIDATION.md"
      - "README.md"
      - ".github/workflows/phase6-completion-integration.yml"
  push:
    branches: [main]
    paths:
      - "tools/phase6_broader_semantics_v0_1/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "tests/test_phase6_broader_semantics*.py"
      - "tests/test_phase6_step_6_5_predicate_argument.py"
      - "tests/test_phase6_integrated_interpreter.py"
      - "documentation/PHASE-6-INTEGRATED-INTERPRETER-AND-BRIDGE-VALIDATION.md"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase6-candidate-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test dependency
        run: python -m pip install "jsonschema==4.23.0"
      - name: Compile Phase 6 and shared application
        run: python -m compileall -q tools/phase6_broader_semantics_v0_1 tools/usg_local_api_v1_0_0 tools/usg-kernel-lab
      - name: Run generated composition contract benchmark
        run: python -m tools.phase6_broader_semantics_v0_1.run_benchmark
      - name: Run Phase 6 composition, persistence, API and UI-server tests
        run: |
          python -m unittest discover -s tests -p 'test_phase6_broader_semantics*.py' -v
          python -m unittest discover -s tests -p 'test_phase6_step_6_5_predicate_argument.py' -v
          python -m unittest discover -s tests -p 'test_phase6_integrated_interpreter.py' -v
          python -m unittest discover -s tests -p 'test_phase6_candidate_provider_integration.py' -v
          python -m unittest discover -s tests -p 'test_phase6_nominal_candidate_v0_4_1.py' -v
          python -m tools.phase6_broader_semantics_v0_1.integrated_benchmark
      - name: Protect accepted contracts and historical implementation lines
        run: |
          git diff --exit-code origin/main...HEAD -- documentation/PHASE-[1-5]* specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json tools/usg_interpretation_v0_1_0 tools/usg_interpretation_v0_2_0 archives/ implementations/semantic-workbench-js/
