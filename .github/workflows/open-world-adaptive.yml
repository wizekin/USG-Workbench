name: Open-World Adaptive Discovery

on:
  pull_request:
    paths:
      - "tools/open_world_evaluation/adaptive_discovery.py"
      - "tests/test_open_world_adaptive.py"
      - ".github/workflows/open-world-adaptive.yml"
  push:
    branches: [main]
    paths:
      - "tools/open_world_evaluation/adaptive_discovery.py"
      - "tests/test_open_world_adaptive.py"
      - ".github/workflows/open-world-adaptive.yml"

permissions:
  contents: read

jobs:
  adaptive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Test historical comparison and bounded follow-up expansion
        run: python -m unittest discover -s tests -p "test_open_world_adaptive.py" -v
      - name: Compile adaptive discovery
        run: python -m py_compile tools/open_world_evaluation/adaptive_discovery.py
