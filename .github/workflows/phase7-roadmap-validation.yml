name: Phase 7 Roadmap and Phase 6 Tracker Validation

on:
  pull_request:
    paths:
      - "documentation/PHASE-7-DEFINITIONS-ROADMAP.md"
      - "documentation/PHASE-6-CONTINUATION-TRACKER.md"
      - "documentation/PHASE-6-DEFINITIONS-ROADMAP.md"
      - "documentation/README.md"
      - "README.md"
      - "evaluations/phase6-continuation/**"
      - "specifications/phase6-continuation-tracker-1.0.schema.json"
      - "tools/phase6_continuation_tracker/**"
      - "tests/test_phase6_continuation_tracker.py"
      - ".github/workflows/phase6-continuation-tracker.yml"
      - ".github/workflows/phase7-roadmap-validation.yml"

permissions:
  contents: read

jobs:
  validate-roadmap-and-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Validate JSON files
        run: |
          python -m json.tool evaluations/phase6-continuation/tracker.json > /dev/null
          python -m json.tool specifications/phase6-continuation-tracker-1.0.schema.json > /dev/null
      - name: Run tracker validation tests
        run: python -m unittest discover -s tests -p 'test_phase6_continuation_tracker.py' -v
      - name: Generate offline preview
        run: |
          python -m tools.phase6_continuation_tracker.report \
            --offline \
            --repository "wizekin/USG-Workbench" \
            --output-dir artifacts/phase6-continuation-tracker
      - name: Upload offline preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-roadmap-tracker-validation
          path: artifacts/phase6-continuation-tracker/
          if-no-files-found: warn
