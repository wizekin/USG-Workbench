name: Open-World Expanding Coverage Ledger

on:
  pull_request:
    paths:
      - "tools/open_world_evaluation/coverage_ledger.py"
      - "tools/open_world_evaluation/schemas/coverage-ledger.schema.json"
      - "tests/test_open_world_coverage_ledger.py"
      - ".github/workflows/open-world-coverage-ledger.yml"
  push:
    branches: [main]
    paths:
      - "tools/open_world_evaluation/coverage_ledger.py"
      - "tools/open_world_evaluation/schemas/coverage-ledger.schema.json"
      - "tests/test_open_world_coverage_ledger.py"
      - ".github/workflows/open-world-coverage-ledger.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Test inventory-to-ledger coverage states
        run: python -m unittest discover -s tests -p "test_open_world_coverage_ledger.py" -v
      - name: Generate and execute a deterministic three-target coverage smoke
        run: |
          set -euo pipefail
          python -m tools.open_world_evaluation.generate_scenarios \
            --count 1 --seed "ow9-coverage-ledger-ci" \
            --created-at "2026-11-11T17:00:00Z" --target-matrix \
            --output "$RUNNER_TEMP/ow9-cases.jsonl"
          python -m tools.open_world_evaluation.execute_cases \
            --input "$RUNNER_TEMP/ow9-cases.jsonl" \
            --output "$RUNNER_TEMP/ow9-results.jsonl" \
            --commit-sha "$GITHUB_SHA" --max-wall-seconds 30
          python -m tools.open_world_evaluation.coverage_ledger \
            --cases "$RUNNER_TEMP/ow9-cases.jsonl" \
            --results "$RUNNER_TEMP/ow9-results.jsonl" \
            --history-root "$RUNNER_TEMP/no-history" \
            --campaign-id OWC-OW9-CI-SMOKE-0001 \
            --output "$RUNNER_TEMP/ow9-coverage-ledger.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          ledger = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ow9-coverage-ledger.json").read_text(encoding="utf-8"))
          rows = {row["component_id"]: row for row in ledger["entrypoint_coverage"]}
          assert ledger["case_count"] == 3
          assert rows["phase4-bounded-interpreter"]["entrypoint_coverage_status"] == "entrypoint_exercised"
          assert rows["phase5-bounded-interpreter"]["entrypoint_coverage_status"] == "entrypoint_exercised"
          assert rows["js-semantic-workbench-v054"]["entrypoint_coverage_status"] == "not_executed_only"
          assert ledger["inventory_component_count"] == 11
          assert ledger["registered_target_profile_count"] == 3
          assert ledger["entrypoint_exercised_component_count"] == 2
          PY
      - name: Compile coverage ledger
        run: python -m py_compile tools/open_world_evaluation/coverage_ledger.py
