name: Phase 6 Step 6.4 Lexical and Morphology Resources
on:
  pull_request:
    paths:
      - "specifications/phase6-lexical-resource-0.3.0.schema.json"
      - "resources/lexical/phase6-v0.3.0/**"
      - "tools/phase6_lexical_resources_v0_3_0/**"
      - "tests/test_phase6_step_6_4_lexical_resources.py"
      - "documentation/PHASE-6-STEP-6.4-LEXICAL-MORPHOLOGY-RESOURCES.md"
      - ".github/workflows/phase6-step-6-4-lexical.yml"
  push:
    branches: [main]
    paths:
      - "specifications/phase6-lexical-resource-0.3.0.schema.json"
      - "resources/lexical/phase6-v0.3.0/**"
      - "tools/phase6_lexical_resources_v0_3_0/**"
      - "tests/test_phase6_step_6_4_lexical_resources.py"
      - ".github/workflows/phase6-step-6-4-lexical.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lexical-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Validate exact lexical evidence and morphology constraints
        run: |
          python -m compileall -q tools/phase6_lexical_resources_v0_3_0
          python -m tools.phase6_lexical_resources_v0_3_0.validate
          python -m unittest discover -s tests -p 'test_phase6_step_6_4_lexical_resources.py' -v
      - name: Verify Phase 1–5 and USG-SEM/1.0 contracts remain unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- documentation/PHASE-[1-5]* specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json specifications/usg-interpret-expression-graph-0.2.0.schema.json tools/usg_interpretation_v0_1_0 tools/usg_interpretation_v0_2_0 archives/ implementations/
