name: USG interoperability registry conformance

on:
  push:
    branches:
      - main
    paths:
      - "interoperability/predicate-frame-registry/**"
      - "interoperability/operator-scope-registry/**"
      - "interoperability/python_adapter/**"
      - "interoperability/workbench_adapter/**"
      - "interoperability/round-trip-conformance/**"
      - "specifications/predicate-frame-registry-1.0.schema.json"
      - "specifications/operator-scope-registry-1.0.schema.json"
      - "specifications/USG-SEM-1.0.md"
      - "specifications/usg-sem-1.0.schema.json"
      - "tests/test_predicate_frame_registry.py"
      - "tests/test_operator_scope_registry.py"
      - "tests/test_document_adapter.py"
      - "tests/test_python_reverse_serializer.py"
      - "tests/test_round_trip_conformance.py"
      - "tests/test_workbench_source_adapter.py"
      - "tests/test_workbench_source_adapter.js"
      - "tests/test_workbench_reconstruction_adapter.js"
      - "tests/round_trip_conformance_bridge.js"
      - "tests/README.md"
      - ".github/workflows/predicate-frame-registry.yml"
      - "implementations/semantic-workbench-js/v0.5.4/semantic-core.js"
      - "implementations/semantic-workbench-js/v0.5.4/semantic-composer.js"
      - "implementations/python-kernel/v0.4.0/usg/foundation/frames.py"
      - "implementations/python-kernel/v0.4.0/usg/model/frames.py"
      - "implementations/python-kernel/v0.4.0/usg/grammar/node.py"
  pull_request:
    branches:
      - main
    paths:
      - "interoperability/predicate-frame-registry/**"
      - "interoperability/operator-scope-registry/**"
      - "interoperability/python_adapter/**"
      - "interoperability/workbench_adapter/**"
      - "interoperability/round-trip-conformance/**"
      - "specifications/predicate-frame-registry-1.0.schema.json"
      - "specifications/operator-scope-registry-1.0.schema.json"
      - "specifications/USG-SEM-1.0.md"
      - "specifications/usg-sem-1.0.schema.json"
      - "tests/test_predicate_frame_registry.py"
      - "tests/test_operator_scope_registry.py"
      - "tests/test_document_adapter.py"
      - "tests/test_python_reverse_serializer.py"
      - "tests/test_round_trip_conformance.py"
      - "tests/test_workbench_source_adapter.py"
      - "tests/test_workbench_source_adapter.js"
      - "tests/test_workbench_reconstruction_adapter.js"
      - "tests/round_trip_conformance_bridge.js"
      - "tests/README.md"
      - ".github/workflows/predicate-frame-registry.yml"
      - "implementations/semantic-workbench-js/v0.5.4/semantic-core.js"
      - "implementations/semantic-workbench-js/v0.5.4/semantic-composer.js"
      - "implementations/python-kernel/v0.4.0/usg/foundation/frames.py"
      - "implementations/python-kernel/v0.4.0/usg/model/frames.py"
      - "implementations/python-kernel/v0.4.0/usg/grammar/node.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registries:
    name: Validate interoperability registries and preserve baselines
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install contract validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run predicate/frame registry tests
        id: predicate-frame-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_predicate_frame_registry.py" -v 2>&1 | tee predicate-frame-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Run operator/scope registry tests
        id: operator-scope-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_operator_scope_registry.py" -v 2>&1 | tee operator-scope-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Run document-level Python adapter tests
        id: document-adapter-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_document_adapter.py" -v 2>&1 | tee document-adapter-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Run Python reverse serializer tests
        id: python-reverse-serializer-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_python_reverse_serializer.py" -v 2>&1 | tee python-reverse-serializer-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Run Workbench source adapter tests
        id: workbench-source-adapter-tests
        shell: bash
        run: |
          set +e
          node --test tests/test_workbench_source_adapter.js 2>&1 | tee workbench-source-adapter-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Validate Workbench adapter output against USG-SEM schema
        id: workbench-source-schema-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_workbench_source_adapter.py" -v 2>&1 | tee workbench-source-schema-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Run Workbench reconstruction adapter tests
        id: workbench-reconstruction-tests
        shell: bash
        run: |
          set +e
          node --test tests/test_workbench_reconstruction_adapter.js 2>&1 | tee workbench-reconstruction-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Run end-to-end semantic invariant conformance
        id: round-trip-conformance-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_round_trip_conformance.py" -v 2>&1 | tee round-trip-conformance-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Verify immutable implementation baselines
        if: success()
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --exit-code FETCH_HEAD...HEAD -- archives implementations
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interoperability-registry-ci-logs
          path: |
            predicate-frame-ci.log
            operator-scope-ci.log
            document-adapter-ci.log
            python-reverse-serializer-ci.log
            workbench-source-adapter-ci.log
            workbench-source-schema-ci.log
            workbench-reconstruction-ci.log
            round-trip-conformance-ci.log
          if-no-files-found: warn
          retention-days: 7
