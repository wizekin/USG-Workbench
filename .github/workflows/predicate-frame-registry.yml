name: Predicate-to-frame registry conformance

on:
  push:
    branches:
      - main
      - "phase1/**"
    paths:
      - "interoperability/predicate-frame-registry/**"
      - "specifications/predicate-frame-registry-1.0.schema.json"
      - "tests/test_predicate_frame_registry.py"
      - ".github/workflows/predicate-frame-registry.yml"
      - "implementations/semantic-workbench-js/v0.5.4/semantic-core.js"
      - "implementations/semantic-workbench-js/v0.5.4/semantic-composer.js"
      - "implementations/python-kernel/v0.4.0/usg/foundation/frames.py"
      - "implementations/python-kernel/v0.4.0/usg/model/frames.py"
  pull_request:
    branches:
      - main
    paths:
      - "interoperability/predicate-frame-registry/**"
      - "specifications/predicate-frame-registry-1.0.schema.json"
      - "tests/test_predicate_frame_registry.py"
      - ".github/workflows/predicate-frame-registry.yml"
      - "implementations/semantic-workbench-js/v0.5.4/semantic-core.js"
      - "implementations/semantic-workbench-js/v0.5.4/semantic-composer.js"
      - "implementations/python-kernel/v0.4.0/usg/foundation/frames.py"
      - "implementations/python-kernel/v0.4.0/usg/model/frames.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registry:
    name: Validate registry and preserve baselines
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run source-backed registry tests
        id: registry-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_predicate_frame_registry.py" -v 2>&1 | tee predicate-frame-ci.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Verify immutable implementation baselines
        if: success()
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --exit-code FETCH_HEAD...HEAD -- archives implementations
      - name: Upload diagnostic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predicate-frame-ci-log
          path: predicate-frame-ci.log
          if-no-files-found: warn
          retention-days: 7
