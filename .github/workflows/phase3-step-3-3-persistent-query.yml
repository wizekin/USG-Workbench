name: Phase 3 Step 3.3 Persistent Query Integration

on:
  pull_request:
    paths:
      - "tools/semantic_query_interface_v1_0_0/**"
      - "tools/semantic_graph_store_v1_0_0/**"
      - "tests/test_phase3_persistent_query.py"
      - "tests/test_phase2_query_interface.py"
      - "tests/test_phase2_evidence_assessment.py"
      - "tests/test_phase2_inference_executor.py"
      - ".github/workflows/phase3-step-3-3-persistent-query.yml"
  push:
    branches: [main]
    paths:
      - "tools/semantic_query_interface_v1_0_0/**"
      - "tools/semantic_graph_store_v1_0_0/**"
      - "tests/test_phase3_persistent_query.py"
      - ".github/workflows/phase3-step-3-3-persistent-query.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-query:
    name: phase3-persistent-query
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile query and store packages
        run: |
          python -m compileall -q tools/semantic_query_interface_v1_0_0
          python -m compileall -q tools/semantic_graph_store_v1_0_0
      - name: Run SQLite canonical store tests
        run: python -m unittest discover -s tests -p "test_phase3_graph_store.py" -v
      - name: Run persistent query integration tests
        run: python -m unittest discover -s tests -p "test_phase3_persistent_query.py" -v
      - name: Run Phase 1 and Phase 2 regressions
        run: |
          python -m unittest discover -s tests -p "test_phase1_exit_acceptance.py" -v
          python -m unittest discover -s tests -p "test_phase2_grounding.py" -v
          python -m unittest discover -s tests -p "test_phase2_inference_executor.py" -v
          python -m unittest discover -s tests -p "test_phase2_evidence_assessment.py" -v
          python -m unittest discover -s tests -p "test_phase2_query_interface.py" -v
