name: Phase 6 Step 6.1 Interpretation and Projection Contract
on:
  pull_request:
    paths:
      - "documentation/PHASE-6-STEP-6.1-INTERPRETATION-AND-PROJECTION-CONTRACT.md"
      - "specifications/usg-interpret-0.3.0.schema.json"
      - "specifications/usg-interpret-expression-graph-0.3.0.schema.json"
      - "tests/test_phase6_step_6_1_contract.py"
      - ".github/workflows/phase6-step-6-1-contract.yml"
      - "README.md"
      - "specifications/README.md"
  push:
    branches: [main]
    paths:
      - "documentation/PHASE-6-STEP-6.1-INTERPRETATION-AND-PROJECTION-CONTRACT.md"
      - "specifications/usg-interpret-0.3.0.schema.json"
      - "specifications/usg-interpret-expression-graph-0.3.0.schema.json"
      - "tests/test_phase6_step_6_1_contract.py"
      - ".github/workflows/phase6-step-6-1-contract.yml"
      - "README.md"
      - "specifications/README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Validate Phase 6 Step 6.1 contract and schemas
        run: python -m unittest discover -s tests -p 'test_phase6_step_6_1_contract.py' -v
      - name: Verify frozen Phase 1–5 contracts, semantic profile, and historical implementations are unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- documentation/PHASE-[1-5]* specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json specifications/usg-interpret-expression-graph-0.2.0.schema.json tools/usg_interpretation_v0_1_0 tools/usg_interpretation_v0_2_0 archives/ implementations/
