name: Phase 3 Step 3.4 Scope-aware Rules

on:
  pull_request:
    paths:
      - "tools/scope_aware_rules_v1_0_0/**"
      - "tests/test_phase3_scope_aware_rules.py"
      - "specifications/usg-sem-1.0.schema.json"
      - "tools/semantic_grounding_v1_0_0/**"
      - ".github/workflows/phase3-step-3-4-scope-aware-rules.yml"
  push:
    branches: [main]
    paths:
      - "tools/scope_aware_rules_v1_0_0/**"
      - "tests/test_phase3_scope_aware_rules.py"
      - ".github/workflows/phase3-step-3-4-scope-aware-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-aware-rules:
    name: phase3-scope-aware-rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile scope-aware package
        run: python -m compileall -q tools/scope_aware_rules_v1_0_0
      - name: Run Step 3.4 adversarial tests
        run: python -m unittest discover -s tests -p "test_phase3_scope_aware_rules.py" -v
      - name: Run canonical store and persistent query regressions
        run: |
          python -m unittest discover -s tests -p "test_phase3_graph_store.py" -v
          python -m unittest discover -s tests -p "test_phase3_persistent_query.py" -v
      - name: Run Phase 1 and Phase 2 regressions
        run: |
          python -m unittest discover -s tests -p "test_phase1_exit_acceptance.py" -v
          python -m unittest discover -s tests -p "test_phase2_grounding.py" -v
          python -m unittest discover -s tests -p "test_phase2_inference_executor.py" -v
          python -m unittest discover -s tests -p "test_phase2_evidence_assessment.py" -v
          python -m unittest discover -s tests -p "test_phase2_query_interface.py" -v
