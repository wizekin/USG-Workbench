name: Phase 6 Step 6.4 CAMeL MSA Morphology Evaluation
on:
  pull_request:
    paths:
      - "tools/phase6_external_pud_v0_5/**"
      - "tests/test_phase6_external_pud_camel_msa.py"
      - "requirements/phase6-camel-morphology.txt"
      - "documentation/PHASE-6-STEP-6.4-CAMEL-MSA-MORPHOLOGY.md"
      - ".github/workflows/phase6-step-6-4-camel-msa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camel-msa-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CAMeL build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/phase6-camel-morphology.txt
      - run: camel_data -i morphology-db-msa-r13
      - run: python -m unittest discover -s tests -p 'test_phase6_external_pud_camel_msa.py' -v
      - run: python -m tools.phase6_external_pud_v0_5.camel_msa
      - name: Upload CAMeL MSA evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: phase6-step-6-4-camel-msa
          path: artifacts/phase6-step-6-4-camel-msa-pud.json
