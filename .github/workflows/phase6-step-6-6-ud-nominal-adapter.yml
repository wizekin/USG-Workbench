name: Phase 6 Step 6.6 UD Nominal Candidate Adapter
on:
  pull_request:
    paths:
      - "tools/phase6_ud_nominal_candidate_v0_1/**"
      - "tests/test_phase6_ud_nominal_adapter.py"
      - "documentation/PHASE-6-STEP-6.6-UD-NOMINAL-ADAPTER.md"
      - ".github/workflows/phase6-step-6-6-ud-nominal-adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ud-nominal-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_phase6_ud_nominal_adapter.py' -v
      - run: python -m tools.phase6_ud_nominal_candidate_v0_1.adapter
      - name: Upload UD nominal candidate report
        uses: actions/upload-artifact@v4
        with:
          name: phase6-step-6-6-ud-nominal-candidates
          path: artifacts/phase6-step-6-6-ud-nominal-candidates.json
