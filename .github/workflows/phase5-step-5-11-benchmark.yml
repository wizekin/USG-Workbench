name: Phase 5 Step 5.11 Full Interpreter Benchmark
on:
  pull_request:
    paths:
      - "tools/phase5_interpretation_benchmark_v0_2_0/**"
      - "tools/usg_interpretation_v0_2_0/**"
      - "resources/**"
      - "benchmarks/phase5-interpretation/v0.2.0/**"
      - "tests/test_phase5_step_5_11_benchmark.py"
      - ".github/workflows/phase5-step-5-11-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "tools/phase5_interpretation_benchmark_v0_2_0/**"
      - "tools/usg_interpretation_v0_2_0/**"
      - "resources/**"
      - "benchmarks/phase5-interpretation/v0.2.0/**"
      - "tests/test_phase5_step_5_11_benchmark.py"
      - ".github/workflows/phase5-step-5-11-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-interpreter-benchmark:
    name: full-interpreter-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark schema dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile interpreter and benchmark packages
        run: |
          python -m compileall -q tools/usg_interpretation_v0_2_0
          python -m compileall -q tools/phase5_interpretation_benchmark_v0_2_0
      - name: Validate corpus and execute real interpreter over all fixtures
        run: |
          mkdir -p benchmark-results
          python -m tools.phase5_interpretation_benchmark_v0_2_0.run --run-pipeline --output benchmark-results/phase5-v0.2.0-report.json
      - name: Run Step 5.11 benchmark regression tests
        run: python -m unittest discover -s tests -p "test_phase5_step_5_11_benchmark.py" -v
      - name: Upload immutable benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-v0.2.0-benchmark-report
          path: benchmark-results/phase5-v0.2.0-report.json
          if-no-files-found: warn
