name: Step 5S Native UnresolvedItem Model
on:
  pull_request:
    paths:
      - "implementations/python-kernel/v1.2.0/**"
      - "interoperability/python-kernel-extension/STEP-5S-NATIVE-UNRESOLVED-ITEM-MODEL.md"
      - ".github/workflows/step-5s-native-unresolved-item-model.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v1.2.0/**"
      - "interoperability/python-kernel-extension/STEP-5S-NATIVE-UNRESOLVED-ITEM-MODEL.md"
      - ".github/workflows/step-5s-native-unresolved-item-model.yml"
permissions:
  contents: read
jobs:
  native-unresolved-item:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native UnresolvedItem model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.2.0
        run: python -m unittest discover -s implementations/python-kernel/v1.2.0/tests -v
