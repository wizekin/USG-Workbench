name: Phase 5 Step 5.1 Interpretation Contract
on:
  pull_request:
    paths:
      - "documentation/PHASE-5-STEP-5.1-INTERPRETATION-EXPANSION-CONTRACT.md"
      - "tests/test_phase5_contract.py"
      - ".github/workflows/phase5-step-5-1-contract.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "documentation/PHASE-5-STEP-5.1-INTERPRETATION-EXPANSION-CONTRACT.md"
      - "tests/test_phase5_contract.py"
      - ".github/workflows/phase5-step-5-1-contract.yml"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frozen Phase 5 contract
        run: python -m unittest tests.test_phase5_contract -v
      - name: Verify semantic schema, Phase 4 interpreter, and historical implementations are unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json tools/usg_interpretation_v0_1_0 archives/ implementations/
