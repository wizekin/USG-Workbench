name: Phase 3 Graph Store

on:
  pull_request:
    paths:
      - "tools/semantic_graph_store_v1_0_0/**"
      - "tests/test_phase3_graph_store.py"
      - "documentation/PHASE-3-*.md"
      - ".github/workflows/phase3-graph-store.yml"
  push:
    branches: [main]
    paths:
      - "tools/semantic_graph_store_v1_0_0/**"
      - "tests/test_phase3_graph_store.py"
      - "documentation/PHASE-3-*.md"
      - ".github/workflows/phase3-graph-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-store:
    name: phase3-store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile canonical store package
        run: python -m compileall -q tools/semantic_graph_store_v1_0_0
      - name: Run canonical graph-store tests
        run: python -m unittest discover -s tests -p "test_phase3_graph_store.py" -v
