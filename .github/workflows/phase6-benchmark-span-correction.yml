name: Phase 6 Benchmark Span Correction v0.3.2
on:
  pull_request:
    paths:
      - "benchmarks/phase6-interpretation-v0.3.2/**"
      - "tools/phase6_interpretation_benchmark_v0_3_2/**"
      - "tests/test_phase6_benchmark_span_correction.py"
      - "documentation/PHASE-6-BENCHMARK-ANNOTATION-CORRECTION-0.3.2.md"
      - ".github/workflows/phase6-benchmark-span-correction.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/phase6-interpretation-v0.3.2/**"
      - "tools/phase6_interpretation_benchmark_v0_3_2/**"
      - "tests/test_phase6_benchmark_span_correction.py"
      - ".github/workflows/phase6-benchmark-span-correction.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corrected-spans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema==4.23.0"
      - run: |
          python -m compileall -q tools/phase6_interpretation_benchmark_v0_3_2
          python -m tools.phase6_interpretation_benchmark_v0_3_2.run
          python -m unittest discover -s tests -p 'test_phase6_benchmark_span_correction.py' -v
