name: Phase 5 Step 5.10 API CLI Kernel Lab Integration
on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_2_0/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tools/semantic_graph_store_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "tests/test_phase5_*.py"
      - "documentation/PHASE-5-STEP-5.10-API-CLI-KERNEL-LAB.md"
      - "documentation/PHASE-5-DEFINITIONS-ROADMAP.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_2_0/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tools/semantic_graph_store_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "tests/test_phase5_*.py"
      - "documentation/PHASE-5-STEP-5.10-API-CLI-KERNEL-LAB.md"
      - "documentation/PHASE-5-DEFINITIONS-ROADMAP.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-phase5:
    name: integrated-phase5
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile integrated packages
        run: |
          python -m compileall -q tools/usg_interpretation_v0_2_0
          python -m compileall -q tools/usg_local_api_v1_0_0
          python -m compileall -q tools/semantic_graph_store_v1_0_0
          python -m compileall -q tools/usg-kernel-lab
      - name: Run Step 5.10 API, transaction, and replay tests
        run: python -m unittest discover -s tests -p "test_phase5_integrated_api.py" -v
      - name: Run Step 5.10 Kernel Lab HTTP/UI tests
        run: python -m unittest discover -s tests -p "test_phase5_kernel_lab.py" -v
      - name: Run all Phase 5 regressions
        run: python -m unittest discover -s tests -p "test_phase5_*.py" -v
      - name: Run frozen Phase 4 regressions
        run: python -m unittest discover -s tests -p "test_phase4_*.py" -v
      - name: Run Phase 3 store and local API/CLI regressions
        run: |
          python -m unittest discover -s tests -p "test_phase3_graph_store.py" -v
          python -m unittest discover -s tests -p "test_phase3_local_api_cli.py" -v
      - name: Verify frozen contracts and historical implementations
        run: |
          git fetch origin main --depth=1
          git diff --exit-code FETCH_HEAD...HEAD -- \
            specifications/USG-SEM-1.0.md \
            specifications/usg-sem-1.0.schema.json \
            tools/usg_interpretation_v0_1_0 \
            benchmarks/phase4-interpretation/ \
            archives/ \
            implementations/
