name: Phase 4 Step 4.12 Frozen Benchmark and Adversarial Evaluation
on:
  pull_request:
    paths:
      - "tools/phase4_interpretation_benchmark_v0_1_0/**"
      - "benchmarks/phase4-interpretation/v0.1.0/**"
      - "tests/test_phase4_benchmark.py"
      - ".github/workflows/phase4-step-4-12-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "tools/phase4_interpretation_benchmark_v0_1_0/**"
      - "benchmarks/phase4-interpretation/v0.1.0/**"
      - "tests/test_phase4_benchmark.py"
      - ".github/workflows/phase4-step-4-12-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    name: phase4-frozen-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4.18,<5"
      - run: python -m compileall -q tools/phase4_interpretation_benchmark_v0_1_0
      - run: python -m unittest discover -s tests -p "test_phase4_benchmark.py" -v
      - run: python -m tools.phase4_interpretation_benchmark_v0_1_0.run --output /tmp/phase4-benchmark-report.json
