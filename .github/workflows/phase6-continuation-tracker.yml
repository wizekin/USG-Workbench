name: Phase 6 Continuation Tracker

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Validate tracker and run offline tests
        run: |
          python -m json.tool evaluations/phase6-continuation/tracker.json > /dev/null
          python -m json.tool specifications/phase6-continuation-tracker-1.0.schema.json > /dev/null
          python -m unittest discover -s tests -p 'test_phase6_continuation_tracker.py' -v
      - name: Discover Phase 6 pull requests and generate status report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.phase6_continuation_tracker.report \
            --repository "${{ github.repository }}" \
            --output-dir artifacts/phase6-continuation-tracker
      - name: Upload tracker snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-continuation-tracker-${{ github.run_id }}
          path: artifacts/phase6-continuation-tracker/
          if-no-files-found: warn
          retention-days: 90
