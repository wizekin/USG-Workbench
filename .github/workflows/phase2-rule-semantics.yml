name: Phase 2 Rule Semantics and Safety Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "rules/semantic-reasoning/semantics/v1.0.0/**"
      - "tools/semantic_rule_semantics_v1_0_0/**"
      - "tests/test_phase2_rule_semantics.py"
      - "documentation/PHASE-2-STEP-2.4-RULE-SEMANTICS-AND-SAFETY-CONTRACT.md"
      - ".github/workflows/phase2-rule-semantics.yml"
  push:
    branches: [main]
    paths:
      - "rules/semantic-reasoning/semantics/v1.0.0/**"
      - "tools/semantic_rule_semantics_v1_0_0/**"
      - "tests/test_phase2_rule_semantics.py"
      - "documentation/PHASE-2-STEP-2.4-RULE-SEMANTICS-AND-SAFETY-CONTRACT.md"
      - ".github/workflows/phase2-rule-semantics.yml"

permissions:
  contents: read

jobs:
  rule-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Validate rule semantics contract
        run: |
          python -m py_compile tools/semantic_rule_semantics_v1_0_0/validator.py
          python -m tools.semantic_rule_semantics_v1_0_0.validator
          python -m unittest discover -s tests -p "test_phase2_rule_semantics.py" -v
