name: Step 5X Definitions Document Adapter
on:
  pull_request:
    paths:
      - "interoperability/python_adapter/document_v14.py"
      - "interoperability/python_adapter/__init__.py"
      - "tests/test_python_kernel_v14_document_adapter.py"
      - "implementations/python-kernel/v1.4.0/**"
      - "specifications/usg-sem-1.0.schema.json"
      - "interoperability/python-kernel-extension/STEP-5X-DEFINITIONS-DOCUMENT-ADAPTER.md"
      - ".github/workflows/step-5x-definitions-document-adapter.yml"
  push:
    branches: [main]
    paths:
      - "interoperability/python_adapter/document_v14.py"
      - "interoperability/python_adapter/__init__.py"
      - "tests/test_python_kernel_v14_document_adapter.py"
      - "implementations/python-kernel/v1.4.0/**"
      - "specifications/usg-sem-1.0.schema.json"
      - "interoperability/python-kernel-extension/STEP-5X-DEFINITIONS-DOCUMENT-ADAPTER.md"
      - ".github/workflows/step-5x-definitions-document-adapter.yml"
permissions:
  contents: read
jobs:
  definitions-document-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run native Definitions model tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.4.0
        run: python -m unittest discover -s implementations/python-kernel/v1.4.0/tests -v
      - name: Run Definitions document adapter tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.4.0
        run: python -m unittest discover -s tests -p "test_python_kernel_v14_document_adapter.py" -v
