name: Phase 3 Step 3.8 Packaging and Demo

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "requirements-phase3.lock"
      - "scripts/build_release_manifest.py"
      - "examples/phase3/**"
      - "release/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "tests/test_phase3_packaging.py"
      - ".github/workflows/phase3-step-3-8-packaging.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "requirements-phase3.lock"
      - "scripts/build_release_manifest.py"
      - "examples/phase3/**"
      - "release/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "tests/test_phase3_packaging.py"
      - ".github/workflows/phase3-step-3-8-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-clean-install:
    name: phase3-package-clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2"
      - name: Run packaging and manifest tests
        run: python -m unittest discover -s tests -p "test_phase3_packaging.py" -v
      - name: Generate deterministic release manifest
        run: python scripts/build_release_manifest.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/usg-clean"
          "$RUNNER_TEMP/usg-clean/bin/python" -m pip install dist/*.whl
      - name: Verify installed entry point and packaged sample
        run: |
          CLEAN="$RUNNER_TEMP/usg-clean/bin"
          "$CLEAN/usg-workbench" --version
          "$CLEAN/usg-workbench" lab --help
          SAMPLE=$("$CLEAN/python" -c 'import examples, pathlib; print(pathlib.Path(examples.__file__).parent / "phase3/sample-usg-sem-1.0.json")')
          "$CLEAN/usg-workbench" validate "$SAMPLE"
          "$CLEAN/python" -c 'import tools.usg_local_api_v1_0_0, tools.document_analysis_services_v1_0_0, tools.scope_aware_rules_v1_0_0, tools.semantic_graph_store_v1_0_0, usg_discourse_v07; print("installed package imports passed")'
      - name: Upload wheel, source distribution, and release manifest
        uses: actions/upload-artifact@v4
        with:
          name: usg-workbench-phase3-package
          path: |
            dist/*
            release/phase3-release-manifest.json
