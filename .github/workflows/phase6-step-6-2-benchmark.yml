name: Phase 6 Step 6.2 Expanded Benchmark Corpus and Evaluator
on:
  pull_request:
    paths:
      - "benchmarks/phase6-interpretation-v0.3.0/**"
      - "tools/phase6_interpretation_benchmark_v0_3_0/**"
      - "tests/test_phase6_step_6_2_benchmark.py"
      - "documentation/PHASE-6-STEP-6.2-EXPANDED-BENCHMARK-AND-EVALUATOR.md"
      - ".github/workflows/phase6-step-6-2-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/phase6-interpretation-v0.3.0/**"
      - "tools/phase6_interpretation_benchmark_v0_3_0/**"
      - "tests/test_phase6_step_6_2_benchmark.py"
      - ".github/workflows/phase6-step-6-2-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Validate frozen Phase 6 corpus and evaluator
        run: |
          python -m compileall -q tools/phase6_interpretation_benchmark_v0_3_0
          python -m unittest discover -s tests -p 'test_phase6_step_6_2_benchmark.py' -v
      - name: Verify Phase 4 and Phase 5 benchmark baselines remain unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- benchmarks/phase4-interpretation benchmarks/phase5-interpretation benchmarks/phase5-interpretation-v0.2.1 tools/phase5_interpretation_benchmark_v0_2_0 tests/test_phase5_step_5_11_benchmark.py
