name: USG Kernel Lab

on:
  pull_request:
    paths:
      - "tools/usg-kernel-lab/**"
      - "tests/test_usg_kernel_lab.py"
      - "interoperability/python_adapter/document_v07.py"
      - "implementations/python-kernel/v0.7.0/**"
      - "specifications/usg-sem-1.0.schema.json"
      - "tools/semantic_query_interface_v1_0_0/**"
      - "tools/semantic_inference_v1_0_0/**"
      - "tools/semantic_evidence_assessment_v1_0_0/**"
      - "tools/semantic_grounding_v1_0_0/**"
      - "benchmarks/semantic-reasoning/query-v1.0.0/**"
      - "benchmarks/semantic-reasoning/executor-v1.0.0/**"
      - "benchmarks/semantic-reasoning/evidence-v1.0.0/**"
      - ".github/workflows/usg-kernel-lab.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg-kernel-lab/**"
      - "tests/test_usg_kernel_lab.py"
      - "interoperability/python_adapter/document_v07.py"
      - "implementations/python-kernel/v0.7.0/**"
      - "specifications/usg-sem-1.0.schema.json"
      - ".github/workflows/usg-kernel-lab.yml"

permissions:
  contents: read

jobs:
  kernel-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Test local browser lab integration
        env:
          PYTHONPATH: implementations/python-kernel/v0.7.0
        run: python -m unittest discover -s tests -p "test_usg_kernel_lab.py" -v
      - name: Compile server and Phase 2 query dependencies
        run: python -m compileall -q tools/usg-kernel-lab tools/semantic_query_interface_v1_0_0 tools/semantic_inference_v1_0_0 tools/semantic_evidence_assessment_v1_0_0 tools/semantic_grounding_v1_0_0
