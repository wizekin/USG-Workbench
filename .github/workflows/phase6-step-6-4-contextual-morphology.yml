name: Phase 6 Step 6.4 Contextual MSA Morphology Disambiguation
on:
  pull_request:
    paths:
      - "tools/phase6_external_pud_v0_6/**"
      - "tests/test_phase6_external_pud_contextual.py"
      - "requirements/phase6-camel-morphology.txt"
      - "documentation/PHASE-6-STEP-6.4-CONTEXTUAL-MSA-DISAMBIGUATION.md"
      - ".github/workflows/phase6-step-6-4-contextual-morphology.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contextual-morphology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps camel-tools==1.6.0
      - run: python -m pip install -r requirements/phase6-camel-morphology.txt
      - run: camel_data -i morphology-db-msa-r13
      - run: camel_data -i disambig-mle-calima-msa-r13
      - run: python -m unittest discover -s tests -p 'test_phase6_external_pud_contextual.py' -v
      - run: python -m tools.phase6_external_pud_v0_6.contextual
      - name: Upload contextual disambiguation report
        uses: actions/upload-artifact@v4
        with:
          name: phase6-step-6-4-contextual-morphology
          path: artifacts/phase6-step-6-4-contextual-morphology.json
