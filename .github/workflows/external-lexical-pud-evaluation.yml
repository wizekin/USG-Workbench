name: External Lexical Crawl PUD Evaluation
on:
  pull_request:
    paths:
      - "tools/usg_external_lexical_v0_1_0/pud_evaluation.py"
      - "tests/test_external_lexical_pud_evaluation.py"
      - "documentation/EXTERNAL-LEXICAL-PUD-EVALUATION-v0.1.0.md"
      - ".github/workflows/external-lexical-pud-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_external_lexical_v0_1_0/pud_evaluation.py"
      - "tests/test_external_lexical_pud_evaluation.py"
      - "documentation/EXTERNAL-LEXICAL-PUD-EVALUATION-v0.1.0.md"
      - ".github/workflows/external-lexical-pud-evaluation.yml"
  workflow_run:
    workflows: ["USG External Lexical Incremental Crawl"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout USG code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - name: Checkout durable lexical evidence
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: usg-external-lexical-data
          path: lexical-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run evaluator tests
        run: python -m unittest discover -s tests -p 'test_external_lexical_pud_evaluation.py' -v
      - name: Evaluate crawl-derived POS candidates against pinned English PUD
        if: github.event_name != 'pull_request'
        run: |
          python -m tools.usg_external_lexical_v0_1_0.pud_evaluation \
            --data-dir lexical-data/shards \
            --output artifacts/external-lexical-pud-evaluation.json
      - name: Upload evaluation report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: external-lexical-pud-evaluation
          path: artifacts/external-lexical-pud-evaluation.json
