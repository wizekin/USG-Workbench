name: USG Open-World Continuous Exploration

on:
  schedule:
    - cron: "15 2 * * *"
    - cron: "30 3 * * 1"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prompt_count:
        description: "Base random prompt count (each prompt is tested against every registered target)"
        required: false
        default: "100"
        type: string
  pull_request:
    paths:
      - ".github/workflows/open-world-continuous.yml"
      - "tools/open_world_evaluation/campaign_profiles.py"
      - "tools/open_world_evaluation/coverage_ledger.py"
      - "tools/open_world_evaluation/target_profiles.json"
      - "tools/open_world_evaluation/worker.py"
      - "tools/open_world_evaluation/operation_oracles.py"
      - "tools/open_world_evaluation/schemas/coverage-ledger.schema.json"
      - "tests/test_open_world_continuous.py"
      - "tests/test_open_world_component_adapters.py"
      - "tests/test_open_world_operation_oracles.py"
      - "tests/test_open_world_browser.py"
      - "tests/test_phase3_local_api_cli.py"
      - "tests/test_phase4_integrated_api.py"
      - "tests/test_phase5_integrated_api.py"
      - "tests/test_open_world_reference_kernel_v04.py"
      - "tests/test_python_kernel_v05_adapter.py"
      - "tests/test_python_kernel_v05_document_adapter.py"
      - "implementations/python-kernel/v0.4.0/**"
      - "implementations/python-kernel/v0.5.0/**"
      - "tools/usg_interpretation_v0_1_0/**"
      - "tools/usg_interpretation_v0_2_0/**"
      - "tests/test_workbench_source_adapter.py"
      - "tests/test_workbench_source_adapter.js"
      - "tests/test_workbench_reconstruction_adapter.js"
      - "interoperability/workbench_adapter/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tests/test_python_kernel_v15_document_adapter.py"
      - "implementations/python-kernel/v0.6.0/**"
      - "implementations/python-kernel/v0.7.0/**"
      - "implementations/python-kernel/v0.8.0/**"
      - "implementations/python-kernel/v0.9.0/**"
      - "implementations/python-kernel/v1.0.0/**"
      - "implementations/python-kernel/v1.1.0/**"
      - "implementations/python-kernel/v1.2.1/**"
      - "implementations/python-kernel/v1.3.0/**"
      - "implementations/python-kernel/v1.4.0/**"
      - "implementations/semantic-workbench-js/v0.5.4/**"
      - "tests/test_phase2_inference_executor.py"
      - "tests/test_phase3_graph_store.py"
      - "tests/test_phase3_persistent_query.py"
      - "tests/test_phase6_step_6_5_predicate_argument.py"
      - "tests/test_phase6_nominal_candidate_v0_4_1.py"
      - "documentation/USG-OPEN-WORLD-CONTINUOUS-EXPLORATION.md"
      - "documentation/OW-12-NATIVE-AND-BROWSER-ORACLES.md"
      - "documentation/OW-13-FULL-GENERATION-AND-REASONING-COVERAGE.md"
      - "documentation/OW-14-LOCAL-API-AND-WORKBENCH-ADAPTERS.md"
      - "documentation/OW-15-PHASE4-PHASE5-INTERPRETER-ORACLES.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: usg-open-world-continuous
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protocol validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Test campaign budget and cadence profiles
        run: python -m unittest discover -s tests -p "test_open_world_continuous.py" -v
      - name: Test full component adapter registry
        run: python -m unittest discover -s tests -p "test_open_world_component_adapters.py" -v
      - name: Test operation-oracle registry
        run: python -m unittest discover -s tests -p "test_open_world_operation_oracles.py" -v
      - name: Run operation-level tests with independent fixture oracles
        run: python -m tools.open_world_evaluation.operation_oracles --output "$RUNNER_TEMP/ow11-operation-oracle-report.json"
      - name: Compile evaluation entry points
        run: python -m py_compile tools/open_world_evaluation/campaign_profiles.py tools/open_world_evaluation/worker.py tools/open_world_evaluation/operation_oracles.py

  browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright runtime
        run: |
          python -m pip install "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium
      - name: Serve the static Workbench
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory implementations/semantic-workbench-js/v0.5.4 > "$RUNNER_TEMP/workbench-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/workbench-http.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/workbench-http.log"
          exit 1
      - name: Exercise Workbench in headless Chromium
        env:
          USG_WORKBENCH_URL: http://127.0.0.1:8765/
        run: python -m unittest discover -s tests -p "test_open_world_browser.py" -v
      - name: Exercise Workbench-to-canonical adapter in Node.js
        run: node --test tests/test_workbench_source_adapter.js tests/test_workbench_reconstruction_adapter.js
      - name: Run complete Workbench JavaScript regression suite
        run: bash implementations/semantic-workbench-js/v0.5.4/tests/run_all_tests.sh
      - name: Stop static server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/workbench-http.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/workbench-http.pid")" || true
          fi
  campaign:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CAMPAIGN_ID: OWC-OW7-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run operation-level tests with independent fixture oracles
        run: python -m tools.open_world_evaluation.operation_oracles --output "$RUNNER_TEMP/ow11-operation-oracle-report.json"
      - name: Upload operation-oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ow11-operation-oracles-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ow11-operation-oracle-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Resolve cadence profile and resource budget
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          MANUAL_PROMPT_COUNT: ${{ github.event.inputs.prompt_count || '' }}
        run: python -m tools.open_world_evaluation.campaign_profiles
      - name: Verify diagnostic importer and profile contracts
        run: |
          python -m unittest discover -s tests -p "test_open_world_diagnostics.py" -v
          python -m unittest discover -s tests -p "test_open_world_continuous.py" -v
      - name: Generate unconstrained-random target matrix
        run: |
          python -m tools.open_world_evaluation.generate_scenarios \
            --count "$PROMPT_COUNT" \
            --seed "OW7-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target-matrix \
            --output "$RUNNER_TEMP/ow7-random-cases.jsonl"
      - name: Import controlled Phase 4 and Phase 5 diagnostic cases
        run: |
          python -m tools.open_world_evaluation.import_diagnostics \
            --output "$RUNNER_TEMP/ow7-diagnostic-cases.jsonl" \
            --manifest "$RUNNER_TEMP/ow7-diagnostic-manifest.json" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Combine populations and preserve source manifests
        run: |
          cat "$RUNNER_TEMP/ow7-random-cases.jsonl" \
              "$RUNNER_TEMP/ow7-diagnostic-cases.jsonl" \
              > "$RUNNER_TEMP/ow7-all-cases.jsonl"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          random = json.loads((root / "ow7-random-cases.jsonl.manifest.json").read_text(encoding="utf-8"))
          diagnostic = json.loads((root / "ow7-diagnostic-manifest.json").read_text(encoding="utf-8"))
          combined = {
              "manifest_version": "1.0.0",
              "generator_version": random["generator_version"],
              "master_seed": random["master_seed"],
              "cadence": os.environ["OW_CADENCE"],
              "random_population": random,
              "diagnostic_population": diagnostic,
              "random_case_count": random["case_count"],
              "diagnostic_case_count": diagnostic["case_count"],
              "expected_case_count": int(os.environ["OW_EXPECTED_CASE_COUNT"]),
          }
          (root / "ow7-combined-generation-manifest.json").write_text(
              json.dumps(combined, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          rows = [json.loads(line) for line in (root / "ow7-all-cases.jsonl").read_text(encoding="utf-8").splitlines()]
          assert len(rows) == combined["expected_case_count"]
          PY
      - name: Execute the real registered entry points with per-case budgets
        run: |
          python -m tools.open_world_evaluation.execute_cases \
            --input "$RUNNER_TEMP/ow7-all-cases.jsonl" \
            --output "$RUNNER_TEMP/ow7-execution-results.jsonl" \
            --commit-sha "$GITHUB_SHA" \
            --max-wall-seconds 30
      - name: Score primary outcomes for adaptive analysis
        run: |
          python -m tools.open_world_evaluation.score_cases \
            --cases "$RUNNER_TEMP/ow7-all-cases.jsonl" \
            --results "$RUNNER_TEMP/ow7-execution-results.jsonl" \
            --scores "$RUNNER_TEMP/ow7-primary-score-results.jsonl" \
            --summary "$RUNNER_TEMP/ow7-primary-score-summary.json"
      - name: Compare with history and generate bounded adaptive follow-ups
        run: |
          python -m tools.open_world_evaluation.adaptive_discovery \
            --campaign-id "$CAMPAIGN_ID" \
            --cases "$RUNNER_TEMP/ow7-all-cases.jsonl" \
            --results "$RUNNER_TEMP/ow7-execution-results.jsonl" \
            --scores "$RUNNER_TEMP/ow7-primary-score-results.jsonl" \
            --history-root evaluations/open-world/campaigns \
            --output-cases "$RUNNER_TEMP/ow7-adaptive-followup-cases.jsonl" \
            --output-report "$RUNNER_TEMP/ow7-adaptive-discovery.json" \
            --max-cases 150 --variants-per-case 3
      - name: Execute adaptive follow-ups and assemble complete campaign inputs
        run: |
          : > "$RUNNER_TEMP/ow7-adaptive-followup-results.jsonl"
          if [ -s "$RUNNER_TEMP/ow7-adaptive-followup-cases.jsonl" ]; then
            python -m tools.open_world_evaluation.execute_cases \
              --input "$RUNNER_TEMP/ow7-adaptive-followup-cases.jsonl" \
              --output "$RUNNER_TEMP/ow7-adaptive-followup-results.jsonl" \
              --commit-sha "$GITHUB_SHA" --max-wall-seconds 30
          fi
          cat "$RUNNER_TEMP/ow7-all-cases.jsonl" \
              "$RUNNER_TEMP/ow7-adaptive-followup-cases.jsonl" \
              > "$RUNNER_TEMP/ow7-final-cases.jsonl"
          cat "$RUNNER_TEMP/ow7-execution-results.jsonl" \
              "$RUNNER_TEMP/ow7-adaptive-followup-results.jsonl" \
              > "$RUNNER_TEMP/ow7-final-results.jsonl"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          manifest = json.loads((root / "ow7-combined-generation-manifest.json").read_text(encoding="utf-8"))
          discovery = json.loads((root / "ow7-adaptive-discovery.json").read_text(encoding="utf-8"))
          manifest["adaptive_followup_case_count"] = discovery["adaptive_followup_case_count"]
          manifest["adaptive_discovery_version"] = discovery["discovery_version"]
          manifest["adaptive_history_campaign_count"] = discovery["history_campaign_count"]
          (root / "ow7-combined-generation-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          cases = [json.loads(line) for line in (root / "ow7-final-cases.jsonl").read_text(encoding="utf-8").splitlines()]
          results = [json.loads(line) for line in (root / "ow7-final-results.jsonl").read_text(encoding="utf-8").splitlines()]
          assert len(cases) == len(results)
          PY
      - name: Score primary and adaptive campaign outcomes
        run: |
          python -m tools.open_world_evaluation.score_cases \
            --cases "$RUNNER_TEMP/ow7-final-cases.jsonl" \
            --results "$RUNNER_TEMP/ow7-final-results.jsonl" \
            --scores "$RUNNER_TEMP/ow7-final-score-results.jsonl" \
            --summary "$RUNNER_TEMP/ow7-final-score-summary.json"
      - name: Build inventory-backed coverage ledger
        run: |
          python -m tools.open_world_evaluation.coverage_ledger \
            --cases "$RUNNER_TEMP/ow7-final-cases.jsonl" \
            --results "$RUNNER_TEMP/ow7-final-results.jsonl" \
            --history-root evaluations/open-world/campaigns \
            --campaign-id "$CAMPAIGN_ID" \
            --output "$RUNNER_TEMP/ow7-coverage-ledger.json"
      - name: Build and retain immutable campaign report
        run: |
          python -m tools.open_world_evaluation.campaign_pipeline \
            --campaign-id "$CAMPAIGN_ID" \
            --cases "$RUNNER_TEMP/ow7-final-cases.jsonl" \
            --results "$RUNNER_TEMP/ow7-final-results.jsonl" \
            --scores "$RUNNER_TEMP/ow7-final-score-results.jsonl" \
            --generation-manifest "$RUNNER_TEMP/ow7-combined-generation-manifest.json" \
            --adaptive-followups "$RUNNER_TEMP/ow7-adaptive-followup-cases.jsonl" \
            --adaptive-discovery-report "$RUNNER_TEMP/ow7-adaptive-discovery.json" \
            --coverage-ledger "$RUNNER_TEMP/ow7-coverage-ledger.json" \
            --commit-sha "$GITHUB_SHA" \
            --output-root "$RUNNER_TEMP/ow7-campaigns"
          mkdir -p "evaluations/open-world/campaigns"
          cp -a "$RUNNER_TEMP/ow7-campaigns/$CAMPAIGN_ID" "evaluations/open-world/campaigns/$CAMPAIGN_ID"
      - name: Upload immutable campaign artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAMPAIGN_ID }}
          path: evaluations/open-world/campaigns/${{ env.CAMPAIGN_ID }}/
          if-no-files-found: error
          retention-days: 90
      - name: Publish append-only campaign report pull request
        id: report-pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: reports/ow7-${{ github.run_id }}-${{ github.run_attempt }}
          base: main
          add-paths: evaluations/open-world/campaigns/${{ env.CAMPAIGN_ID }}/**
          commit-message: "OW-7: publish ${{ steps.profile.outputs.cadence }} campaign ${{ env.CAMPAIGN_ID }}"
          title: "OW-7 ${{ steps.profile.outputs.cadence }} campaign report: ${{ env.CAMPAIGN_ID }}"
          body: |
            Automated continuous-exploration campaign report.

            - Cadence: ${{ steps.profile.outputs.cadence }}
            - Tested commit: ${{ github.sha }}
            - Random base prompts: ${{ steps.profile.outputs.prompt_count }} x all registered target profiles
            - Controlled diagnostics: 106 repository fixtures
            - Naturalistic population: not yet populated; status remains partial
            - Complete JSONL cases/results/scores, Markdown/JSON report, and SHA-256 manifest are attached
      - name: Record the report PR
        if: always()
        run: |
          echo "Cadence: $OW_CADENCE" >> "$GITHUB_STEP_SUMMARY"
          echo "Campaign: $CAMPAIGN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected cases: $OW_EXPECTED_CASE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.report-pr.outputs.pull-request-number }}" ]; then
            echo "Report PR: ${{ steps.report-pr.outputs.pull-request-number }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report branch: reports/ow7-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_STEP_SUMMARY"
            echo "The campaign artifact was saved and uploaded. Repository Actions settings did not permit automatic PR creation; publish the report branch manually or enable Actions PR creation in repository settings." >> "$GITHUB_STEP_SUMMARY"
          fi
