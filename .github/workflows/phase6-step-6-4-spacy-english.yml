name: Phase 6 Step 6.4 spaCy English Morphology Evaluation
on:
  pull_request:
    paths:
      - "tools/phase6_external_pud_v0_7/**"
      - "tests/test_phase6_external_pud_spacy_english.py"
      - "requirements/phase6-spacy-english.txt"
      - "documentation/PHASE-6-STEP-6.4-SPACY-ENGLISH.md"
      - ".github/workflows/phase6-step-6-4-spacy-english.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spacy-english-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/phase6-spacy-english.txt
      - run: python -m unittest discover -s tests -p 'test_phase6_external_pud_spacy_english.py' -v
      - run: python -m tools.phase6_external_pud_v0_7.spacy_english
      - name: Upload English morphology report
        uses: actions/upload-artifact@v4
        with:
          name: phase6-step-6-4-spacy-english
          path: artifacts/phase6-step-6-4-spacy-english-pud.json
