name: Phase 6 Step 6.6 Nominal Candidate Interpreter
on:
  pull_request:
    paths: ["tools/phase6_nominal_candidate_v0_4_1/**","resources/lexical/phase6-v0.4.1/**","specifications/phase6-nominal-lexicon-0.4.1.schema.json","tests/test_phase6_nominal_candidate_v0_4_1.py","documentation/PHASE-6-STEP-6.6-CANDIDATE-INTERPRETER.md",".github/workflows/phase6-step-6-6-nominal-candidate.yml"]
  push:
    branches: [main]
    paths: ["tools/phase6_nominal_candidate_v0_4_1/**","resources/lexical/phase6-v0.4.1/**","specifications/phase6-nominal-lexicon-0.4.1.schema.json","tests/test_phase6_nominal_candidate_v0_4_1.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema==4.23.0"
      - run: python -m compileall -q tools/phase6_nominal_candidate_v0_4_1
      - run: python -m tools.phase6_nominal_candidate_v0_4_1.run
      - run: python -m unittest discover -s tests -p 'test_phase6_nominal_candidate_v0_4_1.py' -v
