name: Phase 4 Step 4.11 Integrated Interpretation API and SQLite
on:
  pull_request:
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tools/usg_local_api_v1_0_0/application.py"
      - "tests/test_phase4_integrated_api.py"
      - ".github/workflows/phase4-step-4-11-integrated-api.yml"
  push:
    branches: [main]
    paths:
      - "tools/usg_interpretation_v0_1_0/**"
      - "tools/usg_local_api_v1_0_0/application.py"
      - "tests/test_phase4_integrated_api.py"
      - ".github/workflows/phase4-step-4-11-integrated-api.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-api:
    name: phase4-integrated-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API schema dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile interpretation and API packages
        run: python -m compileall -q tools/usg_interpretation_v0_1_0 tools/usg_local_api_v1_0_0
      - name: Run integrated interpretation API tests
        run: python -m unittest discover -s tests -p "test_phase4_integrated_api.py" -v
