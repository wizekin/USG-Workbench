name: Phase 1 Exit Acceptance
on:
  pull_request:
    paths:
      - "tests/test_phase1_exit_acceptance.py"
      - "tests/test_python_kernel_v15_document_adapter.py"
      - "interoperability/PHASE-1-EXIT-ACCEPTANCE.md"
      - ".github/workflows/phase1-exit-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "tests/test_phase1_exit_acceptance.py"
      - "tests/test_python_kernel_v15_document_adapter.py"
      - "interoperability/PHASE-1-EXIT-ACCEPTANCE.md"
      - ".github/workflows/phase1-exit-acceptance.yml"
permissions:
  contents: read
jobs:
  phase1-exit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run Phase 1 exit acceptance
        env:
          PYTHONPATH: implementations/python-kernel/v0.5.0
        run: python -m unittest discover -s tests -p "test_phase1_exit_acceptance.py" -v
      - name: Run composed v1.5.1 adapter regression
        env:
          PYTHONPATH: implementations/python-kernel/v0.5.0
        run: python -m unittest discover -s tests -p "test_python_kernel_v15_document_adapter.py" -v
