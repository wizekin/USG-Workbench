name: Phase 1 Exit Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/test_phase1_exit_acceptance.py"
      - "tests/test_python_kernel_v*_document_adapter.py"
      - "tests/test_predicate_frame_registry.py"
      - "tests/test_operator_scope_registry.py"
      - "tests/test_document_adapter.py"
      - "tests/test_python_reverse_serializer.py"
      - "tests/test_round_trip_conformance.py"
      - "tests/test_workbench_source_adapter.py"
      - "tests/test_workbench_source_adapter.js"
      - "tests/test_workbench_reconstruction_adapter.js"
      - "interoperability/**"
      - "specifications/**"
      - ".github/workflows/phase1-exit-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "tests/test_phase1_exit_acceptance.py"
      - "tests/test_python_kernel_v*_document_adapter.py"
      - "interoperability/**"
      - "specifications/**"
      - ".github/workflows/phase1-exit-acceptance.yml"
permissions:
  contents: read

jobs:
  phase1-exit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run Phase 1 exit acceptance
        env:
          PYTHONPATH: implementations/python-kernel/v0.5.0:tests
        run: python -m unittest discover -s tests -p "test_phase1_exit_acceptance.py" -v
      - name: Run all versioned Python document-adapter regressions
        env:
          PYTHONPATH: implementations/python-kernel/v0.5.0:tests
        run: python -m unittest discover -s tests -p "test_python_kernel_v*_document_adapter.py" -v
      - name: Run predicate/frame and operator/scope registry conformance
        env:
          PYTHONPATH: implementations/python-kernel/v0.5.0:tests
        run: |
          python -m unittest discover -s tests -p "test_predicate_frame_registry.py" -v
          python -m unittest discover -s tests -p "test_operator_scope_registry.py" -v
      - name: Run canonical adapter and round-trip conformance
        env:
          PYTHONPATH: implementations/python-kernel/v0.5.0:tests
        run: |
          python -m unittest discover -s tests -p "test_document_adapter.py" -v
          python -m unittest discover -s tests -p "test_python_reverse_serializer.py" -v
          python -m unittest discover -s tests -p "test_round_trip_conformance.py" -v
      - name: Run Workbench source and reconstruction boundaries
        env:
          PYTHONPATH: implementations/python-kernel/v0.5.0:tests
        run: |
          node --test tests/test_workbench_source_adapter.js
          python -m unittest discover -s tests -p "test_workbench_source_adapter.py" -v
          node --test tests/test_workbench_reconstruction_adapter.js
      - name: Verify immutable implementation baselines
        run: |
          git fetch origin main --depth=1
          changed=$(git diff --name-only FETCH_HEAD...HEAD -- archives implementations | while IFS= read -r path; do
            case "$path" in
              archives/*|implementations/python-kernel/v0.4.0/*|implementations/python-kernel/v0.5.0/*)
                echo "$path"
                ;;
              implementations/python-kernel/README.md)
                ;;
              implementations/*)
                if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
                  echo "$path"
                fi
                ;;
            esac
          done)
          test -z "$changed" || { echo "Immutable baseline files were modified:"; echo "$changed"; exit 1; }
