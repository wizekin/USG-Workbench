name: Step 5P Context Document Adapter
on:
  pull_request:
    paths:
      - "interoperability/python_adapter/document_v10.py"
      - "interoperability/python_adapter/__init__.py"
      - "tests/test_python_kernel_v10_document_adapter.py"
      - "implementations/python-kernel/v1.0.0/**"
      - "specifications/usg-sem-1.0.schema.json"
      - "interoperability/python-kernel-extension/STEP-5P-CONTEXT-DOCUMENT-ADAPTER.md"
      - ".github/workflows/step-5p-context-document-adapter.yml"
  push:
    branches: [main]
    paths:
      - "interoperability/python_adapter/document_v10.py"
      - "interoperability/python_adapter/__init__.py"
      - "tests/test_python_kernel_v10_document_adapter.py"
      - "implementations/python-kernel/v1.0.0/**"
      - "specifications/usg-sem-1.0.schema.json"
      - "interoperability/python-kernel-extension/STEP-5P-CONTEXT-DOCUMENT-ADAPTER.md"
      - ".github/workflows/step-5p-context-document-adapter.yml"
permissions:
  contents: read
jobs:
  context-document-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run native Context model conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.0.0
        run: python -m unittest discover -s implementations/python-kernel/v1.0.0/tests -v
      - name: Run Context document adapter conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v1.0.0
        run: python -m unittest discover -s tests -p "test_python_kernel_v10_document_adapter.py" -v
