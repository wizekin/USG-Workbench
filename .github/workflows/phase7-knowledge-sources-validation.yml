name: Phase 7 Rights-Aware Source Adapters Validation

on:
  pull_request:
    paths:
      - 'tools/phase7_knowledge_sources/**'
      - 'tools/phase7_knowledge_contract/**'
      - 'tools/phase7_knowledge_repository/**'
      - 'tools/phase7_knowledge_relations/**'
      - 'tools/phase7_knowledge_retrieval/**'
      - 'tools/phase7_knowledge_integration/**'
      - 'tools/phase7_knowledge_inspection/**'
      - 'tools/phase7_knowledge_evaluation/**'
      - 'evaluations/phase7/**'
      - 'resources/lexical/v0.3.0/en-ar-discourse-lexicon.json'
      - 'tools/usg-kernel-lab/server.py'
      - 'tools/usg-kernel-lab/index.html'
      - 'specifications/usg-knowledge-relation-registry-0.1.0.json'
      - 'tools/usg_external_lexical_v0_1_0/adapter.py'
      - 'specifications/usg-knowledge-0.1.0.schema.json'
      - 'specifications/usg-lexical-candidates-0.1.0.schema.json'
      - 'specifications/usg-sem-1.0.schema.json'
      - 'tests/test_phase7_knowledge_sources.py'
      - 'tests/test_phase7_knowledge_relations.py'
      - 'tests/test_phase7_knowledge_retrieval.py'
      - 'tests/test_phase7_knowledge_integration.py'
      - 'tests/test_phase7_knowledge_inspection.py'
      - 'tests/test_phase7_knowledge_evaluation.py'
      - '.github/workflows/phase7-knowledge-sources-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Compile Phase 7 knowledge packages
        run: python -m compileall -q tools/phase7_knowledge_sources tools/phase7_knowledge_relations tools/phase7_knowledge_retrieval tools/phase7_knowledge_integration tools/phase7_knowledge_inspection tools/phase7_knowledge_evaluation
      - name: Run rights-aware source adapter tests
        run: python -m unittest discover -s tests -p 'test_phase7_knowledge_sources.py' -v
      - name: Run typed relation and reconciliation tests
        run: python -m unittest discover -s tests -p 'test_phase7_knowledge_relations.py' -v
      - name: Run contextual retrieval tests
        run: python -m unittest discover -s tests -p 'test_phase7_knowledge_retrieval.py' -v
      - name: Run read-only consumer integration tests
        run: python -m unittest discover -s tests -p 'test_phase7_knowledge_integration.py' -v
      - name: Run knowledge inspection service, CLI, and Kernel Lab API tests
        run: python -m unittest discover -s tests -p 'test_phase7_knowledge_inspection.py' -v
      - name: Run frozen bilingual Phase 7 exit evaluation
        run: python -m unittest discover -s tests -p 'test_phase7_knowledge_evaluation.py' -v
      - name: Generate machine-readable Phase 7 acceptance report
        run: python -m tools.phase7_knowledge_evaluation.evaluate --output phase7-acceptance-report.json
      - name: Upload Phase 7 acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: phase7-acceptance-report
          path: phase7-acceptance-report.json
      - name: Protect prior semantic and interpretation contracts
        run: |
          git diff --exit-code origin/main...HEAD -- specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json
          git diff --exit-code origin/main...HEAD -- documentation/PHASE-[1-6]* tools/semantic_graph_store_v1_0_0 tools/usg_interpretation_v0_1_0 tools/usg_interpretation_v0_2_0 archives/ implementations/semantic-workbench-js/
