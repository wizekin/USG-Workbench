name: Phase 2 Exit Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/semantic-reasoning/**"
      - "rules/semantic-reasoning/**"
      - "tools/semantic_reasoning_benchmark_v1_0_0/**"
      - "tools/semantic_rule_registry_v1_0_0/**"
      - "tools/semantic_rule_semantics_v1_0_0/**"
      - "tools/semantic_grounding_v1_0_0/**"
      - "tools/semantic_inference_v1_0_0/**"
      - "tools/semantic_evidence_assessment_v1_0_0/**"
      - "tools/semantic_query_interface_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "tests/test_phase2_*.py"
      - "tests/test_semantic_reasoning_benchmark.py"
      - "tests/test_phase1_exit_acceptance.py"
      - "tests/test_usg_kernel_lab.py"
      - "specifications/usg-sem-1.0.schema.json"
      - "interoperability/**"
      - "documentation/PHASE-2-*.md"
      - "documentation/README.md"
      - ".github/workflows/phase2-exit-acceptance.yml"
      - "tools/phase2_exit_acceptance/**"
  push:
    branches: [main]
    paths:
      - "benchmarks/semantic-reasoning/**"
      - "rules/semantic-reasoning/**"
      - "tools/semantic_reasoning_benchmark_v1_0_0/**"
      - "tools/semantic_rule_registry_v1_0_0/**"
      - "tools/semantic_rule_semantics_v1_0_0/**"
      - "tools/semantic_grounding_v1_0_0/**"
      - "tools/semantic_inference_v1_0_0/**"
      - "tools/semantic_evidence_assessment_v1_0_0/**"
      - "tools/semantic_query_interface_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "tests/test_phase2_*.py"
      - "tests/test_semantic_reasoning_benchmark.py"
      - "tests/test_phase1_exit_acceptance.py"
      - "tests/test_usg_kernel_lab.py"
      - "specifications/usg-sem-1.0.schema.json"
      - "interoperability/**"
      - "documentation/PHASE-2-*.md"
      - "documentation/README.md"
      - ".github/workflows/phase2-exit-acceptance.yml"
      - "tools/phase2_exit_acceptance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2-exit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Verify Phase 1 immutable baselines
        run: |
          git fetch origin main
          git diff --exit-code FETCH_HEAD...HEAD -- archives implementations
      - name: Run complete Phase 2 and Phase 1 exit acceptance
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: implementations/python-kernel/v0.5.0:tests
        run: python -m tools.phase2_exit_acceptance.run --report phase2-exit-acceptance-report.json
      - name: Upload machine-readable acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-exit-acceptance-report
          path: phase2-exit-acceptance-report.json
          if-no-files-found: warn
