name: Phase 3 Step 3.9 Integrated Exit Acceptance

on:
  pull_request:
    paths:
      - "tools/phase3_exit_acceptance_v1_0_0/**"
      - "tools/semantic_graph_store_v1_0_0/**"
      - "tools/semantic_query_interface_v1_0_0/**"
      - "tools/scope_aware_rules_v1_0_0/**"
      - "tools/document_analysis_services_v1_0_0/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "specifications/**"
      - "rules/**"
      - "benchmarks/**"
      - "interoperability/**"
      - "examples/**"
      - "release/**"
      - "scripts/build_release_manifest.py"
      - "pyproject.toml"
      - "setup.py"
      - "requirements-phase3.lock"
      - "requirements-build.lock"
      - "tests/test_phase*.py"
      - "tests/test_usg_kernel_lab.py"
      - "tests/test_python_kernel_v*_document_adapter.py"
      - "tests/test_document_adapter.py"
      - "tests/test_python_reverse_serializer.py"
      - "tests/test_round_trip_conformance.py"
      - "tests/test_operator_scope_registry.py"
      - "tests/test_predicate_frame_registry.py"
      - "tests/test_workbench_source_adapter.py"
      - ".github/workflows/phase3-step-3-9-exit-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "tools/phase3_exit_acceptance_v1_0_0/**"
      - "tools/semantic_graph_store_v1_0_0/**"
      - "tools/semantic_query_interface_v1_0_0/**"
      - "tools/scope_aware_rules_v1_0_0/**"
      - "tools/document_analysis_services_v1_0_0/**"
      - "tools/usg_local_api_v1_0_0/**"
      - "tools/usg-kernel-lab/**"
      - "specifications/**"
      - "rules/**"
      - "benchmarks/**"
      - "interoperability/**"
      - "examples/**"
      - "release/**"
      - "scripts/build_release_manifest.py"
      - "pyproject.toml"
      - "setup.py"
      - "requirements-phase3.lock"
      - "requirements-build.lock"
      - "tests/test_phase*.py"
      - "tests/test_usg_kernel_lab.py"
      - "tests/test_python_kernel_v*_document_adapter.py"
      - "tests/test_document_adapter.py"
      - "tests/test_python_reverse_serializer.py"
      - "tests/test_round_trip_conformance.py"
      - "tests/test_operator_scope_registry.py"
      - "tests/test_predicate_frame_registry.py"
      - "tests/test_workbench_source_adapter.py"
      - ".github/workflows/phase3-step-3-9-exit-acceptance.yml"

permissions:
  contents: read

jobs:
  phase3-exit:
    name: phase3-integrated-exit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
$3fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned runtime and build dependencies
        run: python -m pip install -r requirements-phase3.lock -r requirements-build.lock
      - name: Verify immutable historical implementation baselines
        run: |
          git fetch origin main --depth=1
          git diff --exit-code FETCH_HEAD...HEAD -- archives implementations/python-kernel/v0.4.0 implementations/python-kernel/v0.5.0
      - name: Run integrated Phase 1, Phase 2, and Phase 3 acceptance
        env:
          PYTHONPATH: tests:implementations/python-kernel/v0.5.0
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.phase3_exit_acceptance_v1_0_0.run --report phase3-exit-acceptance-report.json --source-commit "${GITHUB_SHA}"
      - name: Run JavaScript Workbench adapter regressions
        run: |
          node --test tests/test_workbench_source_adapter.js
          node --test tests/test_workbench_reconstruction_adapter.js
      - name: Generate release manifest and build distributions
        run: |
          python scripts/build_release_manifest.py
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/usg-phase3-clean"
          "$RUNNER_TEMP/usg-phase3-clean/bin/python" -m pip install dist/*.whl
      - name: Run final shared-SQLite API and Kernel Lab smoke test
        working-directory: ${{ runner.temp }}
        run: |
          CLEAN="$RUNNER_TEMP/usg-phase3-clean/bin"
          DB="$RUNNER_TEMP/usg-phase3-final.sqlite3"
          API_LOG="$RUNNER_TEMP/usg-api.log"
          LAB_LOG="$RUNNER_TEMP/usg-lab.log"
          "$CLEAN/usg-workbench" serve --db "$DB" --port 18766 > "$API_LOG" 2>&1 &
          API_PID=$!
          LAB_PID=""
          trap 'kill "${LAB_PID:-}" "$API_PID" 2>/dev/null || true' EXIT
          wait_for_health() {
            url="$1"
            label="$2"
            logfile="$3"
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$url" > /dev/null; then
                return 0
              fi
              if ! kill -0 "$API_PID" 2>/dev/null && [ "$label" = "API" ]; then
                break
              fi
              if [ "$label" = "Kernel Lab" ] && [ -n "$LAB_PID" ] && ! kill -0 "$LAB_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            echo "$label failed health check at $url"
            cat "$logfile" || true
            return 1
          }
          wait_for_health "http://127.0.0.1:18766/health" "API" "$API_LOG"
          # Start the second application only after the first has completed its
          # SQLite initialization, avoiding simultaneous first-open migrations.
          "$CLEAN/usg-workbench" lab --db "$DB" --port 18765 > "$LAB_LOG" 2>&1 &
          LAB_PID=$!
          wait_for_health "http://127.0.0.1:18765/health" "Kernel Lab" "$LAB_LOG"
          "$CLEAN/python" - <<'PY'
          import json, pathlib, urllib.request
          import examples
          root = pathlib.Path(examples.__file__).parent / "phase3"
          document = json.loads((root / "sample-usg-sem-1.0.json").read_text(encoding="utf-8"))
          query = json.loads((root / "sample-query.json").read_text(encoding="utf-8"))
          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method,
                  headers={"Content-Type":"application/json"} if data is not None else {})
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.loads(response.read().decode())
          api = "http://127.0.0.1:18766"
          lab = "http://127.0.0.1:18765"
          saved = request(api + "/v1/documents", "POST", {"document": document})
          interpretation = request(api + "/v1/interpret", "POST", {
              "text": "Ada writes code", "language": "en", "persist": True
          })
          assert interpretation["completion_status"] == "COMPLETE"
          interpreted_id = interpretation["persistence"]["document_id"]
          interpreted_from_lab = request(lab + "/v1/documents/" + interpreted_id)
          assert interpreted_from_lab["document"]["sources"][0]["text"] == "Ada writes code"
          loaded = request(lab + "/v1/documents/" + document["documentId"])
          assert loaded["document"] == document
          assert loaded["revision"] == saved["revision"] == 1
          assert loaded["sha256"] == saved["sha256"]
          integrity = request(api + "/v1/documents/" + document["documentId"] + "/check")
          assert integrity["status"] == "PASS"
          result = request(api + "/v1/query", "POST", {
              "document_id": document["documentId"], "query": query, "revision": 1
          })
          assert result["document_sha256"] == saved["sha256"]
          assert result["query_result"]["goal_status"] == "DERIVED_NOT_VERIFIED"
          conditions = request(lab + "/v1/documents/" + document["documentId"] + "/conditions")
          conflicts = request(lab + "/v1/documents/" + document["documentId"] + "/contradictions")
          assert conditions["document_sha256"] == conflicts["document_sha256"] == saved["sha256"]
          assert request(lab + "/health")["documentStore"] == "SQLite"
          print(json.dumps({"shared_sqlite_revision": saved["revision"], "sha256": saved["sha256"],
                            "integrity": integrity["status"], "query": result["query_result"]["goal_status"],
                            "conditions": len(conditions["conditions"]), "conflicts": len(conflicts["conflicts"])}, indent=2))
          PY
      - name: Upload final machine-readable acceptance and release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usg-phase3-exit-acceptance
          path: |
            phase3-exit-acceptance-report.json
            release/phase3-release-manifest.json
            dist/*
          if-no-files-found: warn
