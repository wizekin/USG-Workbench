name: Open-World Scoring and Validation

on:
  pull_request:
    paths:
      - "README.md"
      - "documentation/USG-OPEN-WORLD-SCORING-AND-VALIDATION.md"
      - "tools/open_world_evaluation/**"
      - "tests/test_open_world_scoring.py"
      - ".github/workflows/open-world-scoring.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "documentation/USG-OPEN-WORLD-SCORING-AND-VALIDATION.md"
      - "tools/open_world_evaluation/**"
      - "tests/test_open_world_scoring.py"
      - ".github/workflows/open-world-scoring.yml"

permissions:
  contents: read

jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protocol and schema dependencies
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Run OW-4 structural and oracle-boundary tests
        run: python -m unittest discover -s tests -p "test_open_world_scoring.py" -v
      - name: Compile scorer
        run: python -m py_compile tools/open_world_evaluation/score_cases.py
