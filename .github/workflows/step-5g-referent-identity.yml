name: Step 5G Referent Identity Model

on:
  pull_request:
    paths:
      - "implementations/python-kernel/v0.6.0/**"
      - "interoperability/python-kernel-extension/STEP-5G-REFERENT-IDENTITY-MODEL.md"
      - ".github/workflows/step-5g-referent-identity.yml"
  push:
    branches: [main]
    paths:
      - "implementations/python-kernel/v0.6.0/**"
      - "interoperability/python-kernel-extension/STEP-5G-REFERENT-IDENTITY-MODEL.md"
      - ".github/workflows/step-5g-referent-identity.yml"

permissions:
  contents: read

jobs:
  referent-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run v0.6.0 Referent identity conformance tests
        env:
          PYTHONPATH: implementations/python-kernel/v0.6.0
        run: python -m unittest discover -s implementations/python-kernel/v0.6.0/tests -v
