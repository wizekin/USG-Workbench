name: Phase 5 Step 5.2 Benchmark Foundation
on:
  pull_request:
    paths:
      - "benchmarks/phase5-interpretation/v0.2.0/**"
      - "tools/phase5_interpretation_benchmark_v0_2_0/**"
      - "tests/test_phase5_benchmark.py"
      - "documentation/PHASE-5-STEP-5.2-BENCHMARK-FOUNDATION.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-2-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/phase5-interpretation/v0.2.0/**"
      - "tools/phase5_interpretation_benchmark_v0_2_0/**"
      - "tests/test_phase5_benchmark.py"
      - "documentation/PHASE-5-STEP-5.2-BENCHMARK-FOUNDATION.md"
      - "README.md"
      - ".github/workflows/phase5-step-5-2-benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark schema dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Compile Phase 5 benchmark package
        run: python -m compileall -q tools/phase5_interpretation_benchmark_v0_2_0
      - name: Validate corpus and run evaluator tests
        run: |
          python -m tools.phase5_interpretation_benchmark_v0_2_0.run
          python -m unittest discover -s tests -p "test_phase5_benchmark.py" -v
      - name: Run frozen Phase 4 regression suite
        run: python -m unittest discover -s tests -p "test_phase4_*.py" -v
      - name: Verify historical and canonical contracts remain unchanged
        run: |
          git diff --exit-code origin/main...HEAD -- specifications/USG-SEM-1.0.md specifications/usg-sem-1.0.schema.json tools/usg_interpretation_v0_1_0 benchmarks/phase4-interpretation/ archives/ implementations/
