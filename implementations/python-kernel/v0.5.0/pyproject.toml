[project]
name = "usg"
version = "0.5.0"
description = "Universal Semantic Grammar - fully automated reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # the core is standard-library only

[project.scripts]
usg = "usg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["usg*"]
